# 挪到 .github/workflows/ci.yml 后生效（需要 workflow 权限，在 Mac 上提交）
name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  ci-ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run demo
