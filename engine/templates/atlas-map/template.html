<style>
:root{--bg:#04060f;--ink:#e6edf7;--mut:#8b9ab3;--line:rgba(148,163,184,.18);--amber:#fbbf24;--cyan:#67e8f9;--gold:#fde68a;--panel:rgba(10,16,32,.82);
font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

#sync{font-size:11.5px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}#sync.ok{color:#6ee7b7;border-color:#34d399}#sync.warn{color:var(--amber);border-color:var(--amber)}
.srcs{font-size:12px;color:var(--mut);margin-top:10px}.srcs a{color:var(--cyan)}.srcs li{cursor:default;border:0;padding:2px 0;display:block}

.btn.pri{background:linear-gradient(90deg,#0e7490,#6d28d9);border:0}

#legend{bottom:14px;left:16px;font-size:12px;color:var(--mut);background:var(--panel);padding:8px 12px;border-radius:12px;border:1px solid var(--line);display:none;max-width:560px}
#legend.on{display:flex}

.neb{cursor:pointer}
.lbl-dom{font-size:66px;font-weight:700;letter-spacing:.1em;fill:#fff;opacity:.92;pointer-events:none;paint-order:stroke;stroke:rgba(4,6,15,.6);stroke-width:6px;transition:opacity .4s}
.lbl-top{font-size:25px;fill:#dbeafe;cursor:pointer;paint-order:stroke;stroke:rgba(4,6,15,.85);stroke-width:5px;transition:opacity .4s}

.utop .lbl-top{fill:#f0abfc;font-style:italic}
svg.z-far .lbl-top,svg.z-far .lbl-node{opacity:0}
svg.z-mid .lbl-node:not(.lbl-stage){opacity:0}
svg.z-near .lbl-dom{opacity:.28}
svg.z-far .k-related,svg.z-far .k-causes,svg.z-far .k-contrast,svg.z-far .k-prereq{opacity:.1}
.tdot{fill:#93c5fd;opacity:.7}

.k-leads_to{stroke:#fbbf24;stroke-width:2.2;opacity:.85}.k-causes{stroke:#fb7185}.k-related{stroke:#67e8f9;opacity:.32}
.k-prereq{stroke:#a78bfa;stroke-dasharray:6 4}.k-contrast{stroke:#f472b6;stroke-dasharray:2 4}.k-parallel{stroke:#4ade80}
.umem{stroke:#f0abfc;stroke-dasharray:4 5;stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke;opacity:.7}
.nd{cursor:pointer;transition:opacity .25s}
.nd .core{fill:#94a3b8;opacity:.5;transition:all .5s}
.nd .halo{opacity:0;transform-box:fill-box;transform-origin:center}
.nd .ring{fill:none;stroke:var(--amber);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}

.st-seen .core{fill:#e2e8f0;opacity:.85}
.st-learning .core{fill:#fde68a;opacity:.9}.st-learning .ring{opacity:1;animation:pulse 1.8s ease-in-out infinite}
.st-lit .core{fill:#fff;opacity:1}.st-lit .halo{opacity:1;animation:breathe 3.2s ease-in-out infinite}
.st-mastered .core{fill:var(--gold);opacity:1}.st-mastered .halo{opacity:1;fill:url(#gGold);animation:breathe 3.2s ease-in-out infinite}

@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:.2}}

svg.focus .edge:not(.hi),svg.focus .cl{opacity:.05}

.edge.hi{opacity:1!important;stroke-width:2.6}
.nd.flash .core{animation:flash 1.2s ease-out 2}

.panel{position:fixed;z-index:6;right:16px;top:64px;width:340px;max-height:calc(100% - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(10px);display:none;font-size:13.5px;line-height:1.65}

<script>
(function(){
'use strict';
var DATA = null;
try{DATA = JSON.parse(document.getElementById('atlas-data').textContent.replace(/\/\*[\s\S]*?\*\//,''));}catch(e){DATA = null;}
DATA = DATA || {world:{domains:[],topics:[],nodes:[],edges:[],edge_kinds:{}},log:[],pack:{owner:'local',demo:true,device:'browser'}};
DATA.world = DATA.world || {domains:[],topics:[],nodes:[],edges:[],edge_kinds:{}};
DATA.pack = DATA.pack || {owner:'local',device:'browser'};
var W = DATA.world;
var NS = 'http://www.w3.org/2000/svg';
var $ = function(id){return document.getElementById(id)};

function rich(s){return esc(s).replace(/⚠/g,'<span class="unc" title="有争议 / 不确定">⚠</span>')}
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function h(tag,cls,html,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function clamp(x,a,b){return x<a?a:x>b?b:x}
var ease={out:function(p){return 1-Math.pow(1-p,3)},io:function(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2},back:function(p){var c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}};
function toast(msg){var t=h('div','toast',esc(msg),document.body);setTimeout(function(){t.style.opacity=0},1800);setTimeout(function(){t.remove()},2400)}

/* ---- progress: derived from the log ---- */
function masteryFromLog(events, ids, edges, minReviewDays){
  var DAY=86400000, minReview=(minReviewDays==null?1:minReviewDays)*DAY, rank={locked:0,seen:1,learning:2,lit:3,mastered:4}, st={};
  ids.forEach(function(id){st[id]={level:null};});
  function raise(s,l){if(!s.level||rank[l]>rank[s.level])s.level=l;}
  events.slice().sort(function(a,b){return Date.parse(a.ts)-Date.parse(b.ts);}).forEach(function(e){
    if(!e.node||!st[e.node])return; var s=st[e.node], p=e.payload||{}; s.lastEvent=e.ts;
    if(e.action==="open"||e.action==="note"||e.action==="ask"||e.action==="done")raise(s,"seen");
    else if(e.action==="play")raise(s,typeof p.progress==="number"&&p.progress>=0.5?"learning":"seen");
    else if(e.action==="quiz"){var t=Number(p.total||0),c=Number(p.correct||0);if(t>=3&&c===t){raise(s,"lit");if(!s.litAt)s.litAt=e.ts;}else raise(s,"learning");}
    else if(e.action==="lit"){raise(s,"lit");if(!s.litAt)s.litAt=e.ts;}
    else if(e.action==="review"){if(s.litAt&&p.passed===true&&Date.parse(e.ts)-Date.parse(s.litAt)>=minReview)raise(s,"mastered");}
  });
  function isLit(id){var l=st[id]&&st[id].level;return l==="lit"||l==="mastered";}
  ids.forEach(function(id){if(st[id].level)return;var pre=edges.filter(function(e){return e.kind==="prereq"&&e.dst===id;}).map(function(e){return e.src;});if(pre.some(function(p){return !isLit(p);}))st[id].level="locked";});
  return st;
}
function lessonStatus(events, id) {
  var out = { status: "new", chaptersDone: [], interactionsDone: [] };
  var evs = events.filter(function(e){ return e.node === id; }).sort(function(a, b){ return Date.parse(a.ts) - Date.parse(b.ts); });
  var any = false, lit = false, done = false;
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    any = true;
    var p = e.payload || {};
    if (e.action === "play") {
      if (typeof p.chapter === "string" && p.progress === 1 && out.chaptersDone.indexOf(p.chapter) < 0) out.chaptersDone.push(p.chapter);
      if (typeof p.interaction === "string" && out.interactionsDone.indexOf(p.interaction) < 0) out.interactionsDone.push(p.interaction);
    } else if (e.action === "quiz") {
      var total = Number(p.total == null ? 0 : p.total), correct = Number(p.correct == null ? 0 : p.correct);
      if (total >= 3 && correct === total && !lit) { lit = true; out.litAt = e.ts; }
    } else if (e.action === "lit") {
      if (!lit) { lit = true; out.litAt = e.ts; }
    } else if (e.action === "note") {
      if (p.kind === "takeaway" && typeof p.text === "string") out.takeaway = p.text;
    } else if (e.action === "done") {
      if (!done) { done = true; out.doneAt = e.ts; }
    }
  }
  out.status = done ? "done" : lit ? "lit" : any ? "progress" : "new";
  return out;
}

/* ---- user layer (localStorage) ---- */
var KEY='agl.map.v2:'+(DATA.pack.owner||'local'), OLDKEY='scholar.map.v1';
var LV=['unseen','seen','learning','lit','mastered'], LVN={unseen:'未学',seen:'看过',learning:'学习中',lit:'已点亮',mastered:'已掌握',locked:'前置未亮'};
var ACTIONS={open:1,play:1,quiz:1,lit:1,review:1,note:1,ask:1,done:1,topic_create:1,link_create:1};
var U={schema:'agl.map.local.v2',log:[],topics:[],edges:[]};
var memOnly=false;
function evKey(e){return e.ts+'|'+(e.node||'')+'|'+e.action}
function normEv(l){
  if(!l||typeof l!=='object'||typeof l.ts!=='string'||isNaN(Date.parse(l.ts))||!ACTIONS[l.action])return null;
  var ev={ts:l.ts,device:(typeof l.device==='string'&&l.device)||DATA.pack.device||'browser',action:l.action};
  if(typeof l.node==='string'&&l.node)ev.node=l.node;
  if(l.payload&&typeof l.payload==='object')ev.payload=l.payload;
  return ev;
}
function normTopic(t){var o=Object.assign({},t);if(o.desc==null&&o.description!=null)o.desc=o.description;delete o.description;return o}
function normEdge(e){var o=Object.assign({},e);if(o.claim_type==null||o.claim_type==='focus判断')o.claim_type='个人判断';if(o.note==null||o.note==='focus 自建连线')o.note='自建连线';return o}
function convertUser(x){
  return {log:(x.log||[]).map(normEv).filter(Boolean),topics:(x.topics||[]).map(normTopic),edges:(x.edges||[]).map(normEdge)};
}
try{
  var raw=localStorage.getItem(KEY);
  if(raw){var p0=JSON.parse(raw);if(p0&&p0.schema===U.schema){U.log=p0.log||[];U.topics=p0.topics||[];U.edges=p0.edges||[]}}
  else{var oldRaw=localStorage.getItem(OLDKEY);
    if(oldRaw){var o0=JSON.parse(oldRaw);if(o0&&o0.schema==='scholar.map.user.v1'){var cv=convertUser(o0);U.log=cv.log;U.topics=cv.topics;U.edges=cv.edges;try{localStorage.setItem(KEY,JSON.stringify(U))}catch(e2){}}}}
}catch(e){memOnly=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(U))}catch(e){if(!memOnly){memOnly=true;toast('浏览器禁止本地存储：进度只在本次打开有效，请用「导出」保存')}}}

/* ---- events, server write-back hook ---- */
var SESSION=[], sink=null;
function allEvents(){
  var seen={},out=[];
  (DATA.log||[]).concat(SESSION,U.log).forEach(function(e){if(!e)return;var k=evKey(e);if(seen[k])return;seen[k]=1;out.push(e)});
  return out;
}
function setSync(text,ok){var s=document.getElementById('sync');if(!s)return;s.hidden=!text;s.textContent=text||'';s.className='pill '+(ok?'ok':'warn')}
function markSynced(evs){
  var keys={};(evs||[]).forEach(function(e){keys[evKey(e)]=1});
  U.log=U.log.filter(function(e){return !keys[evKey(e)]});
  (evs||[]).forEach(function(e){SESSION.push(e)});

}
/*__WRITER__*/

/* ---- mastery cache ---- */
var MS={};
function nodeIdList(){return W.nodes.map(function(n){return n.id})}
function recomputeMS(){MS=masteryFromLog(allEvents(),nodeIdList(),allEdgesRaw())}
function allEdgesRaw(){return W.edges.concat(U.edges)}
function afterChange(){recomputeMS();if(typeof refreshAll==='function'){refreshAll();updateCount();if(cineOn)headState()}if(typeof LESSONS!=='undefined'&&LESSONS)lessonRefresh()}
function logEv(node,action,payload){
  if(!ACTIONS[action])return;
  var ev={ts:new Date().toISOString(),device:DATA.pack.device||'browser',action:action};
  if(typeof node==='string'&&node)ev.node=node;
  if(payload&&typeof payload==='object')ev.payload=payload;
  U.log.push(ev);if(U.log.length>5000)U.log=U.log.slice(-5000);

  if(sink){try{sink([ev])}catch(e){}}

}
function lvl(id){var l=MS[id]&&MS[id].level;return l||'unseen'}
function isLitNow(id){var l=lvl(id);return l==='lit'||l==='mastered'}

/* ---- graph index ---- */
var N={},T={},D={};
W.domains.forEach(function(d){D[d.id]=d});

function allTopics(){return W.topics.concat(U.topics)}
function allEdges(){return W.edges.concat(U.edges)}
