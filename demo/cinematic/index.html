<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学者 · 知识地图 v0.1</title>
<style>
:root{--bg:#04060f;--ink:#e6edf7;--mut:#8b9ab3;--line:rgba(148,163,184,.18);--amber:#fbbf24;--cyan:#67e8f9;--gold:#fde68a;--panel:rgba(10,16,32,.82);
font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#map{position:fixed;inset:0;width:100%;height:100%;z-index:1;cursor:grab;touch-action:none;user-select:none}
#map.drag{cursor:grabbing}
.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#top{top:14px;left:16px;right:16px;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:20px;letter-spacing:.12em;font-weight:600;text-shadow:0 0 18px rgba(103,232,249,.45)}
.brand .cnt{font-size:13px;color:var(--mut)}.brand .cnt b{color:var(--cyan);font-size:16px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:rgba(15,23,42,.72);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
.btn:hover{border-color:rgba(103,232,249,.6);box-shadow:0 0 12px rgba(103,232,249,.25)}
.btn.pri{background:linear-gradient(90deg,#0e7490,#6d28d9);border:0}
#search{background:rgba(15,23,42,.72);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;width:170px;outline:none}
#legend{bottom:14px;left:16px;font-size:12px;color:var(--mut);background:var(--panel);padding:8px 12px;border-radius:12px;border:1px solid var(--line);display:none;max-width:560px}
#legend.on{display:flex}
#legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:4px}
#legend .dot{width:9px;height:9px;border-radius:50%;margin-right:4px}
#hint{bottom:14px;right:16px;font-size:12px;color:var(--mut)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;max-width:280px;display:none;line-height:1.55}
#tip b{font-size:13.5px}#tip .st{color:var(--cyan);font-size:11.5px;margin-left:6px}
.neb{cursor:pointer}
.lbl-dom{font-size:66px;font-weight:700;letter-spacing:.1em;fill:#fff;opacity:.92;pointer-events:none;paint-order:stroke;stroke:rgba(4,6,15,.6);stroke-width:6px;transition:opacity .4s}
.lbl-top{font-size:25px;fill:#dbeafe;cursor:pointer;paint-order:stroke;stroke:rgba(4,6,15,.85);stroke-width:5px;transition:opacity .4s}
.lbl-node{font-size:14px;fill:#cbd5e1;pointer-events:none;paint-order:stroke;stroke:rgba(4,6,15,.9);stroke-width:4px;transition:opacity .4s}
.lbl-stage{font-size:19px;fill:#f1f5f9;font-weight:600}
.utop .lbl-top{fill:#f0abfc;font-style:italic}
svg.z-far .lbl-top,svg.z-far .lbl-node{opacity:0}
svg.z-mid .lbl-node:not(.lbl-stage){opacity:0}
svg.z-near .lbl-dom{opacity:.28}
svg.z-far .k-related,svg.z-far .k-causes,svg.z-far .k-contrast,svg.z-far .k-prereq{opacity:.1}
.tdot{fill:#93c5fd;opacity:.7}
.cl{stroke:rgba(148,197,253,.16);stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke}
.edge{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.55;transition:opacity .25s}
.k-leads_to{stroke:#fbbf24;stroke-width:2.2;opacity:.85}.k-causes{stroke:#fb7185}.k-related{stroke:#67e8f9;opacity:.32}
.k-prereq{stroke:#a78bfa;stroke-dasharray:6 4}.k-contrast{stroke:#f472b6;stroke-dasharray:2 4}.k-parallel{stroke:#4ade80}
.umem{stroke:#f0abfc;stroke-dasharray:4 5;stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke;opacity:.7}
.nd{cursor:pointer;transition:opacity .25s}
.nd .core{fill:#94a3b8;opacity:.5;transition:all .5s}
.nd .halo{opacity:0;transform-box:fill-box;transform-origin:center}
.nd .ring{fill:none;stroke:var(--amber);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.nd .hit{fill:transparent}
.st-seen .core{fill:#e2e8f0;opacity:.85}
.st-learning .core{fill:#fde68a;opacity:.9}.st-learning .ring{opacity:1;animation:pulse 1.8s ease-in-out infinite}
.st-lit .core{fill:#fff;opacity:1}.st-lit .halo{opacity:1;animation:breathe 3.2s ease-in-out infinite}
.st-mastered .core{fill:var(--gold);opacity:1}.st-mastered .halo{opacity:1;fill:url(#gGold);animation:breathe 3.2s ease-in-out infinite}
.st-locked{opacity:.32}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:.2}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}}
svg.focus .edge:not(.hi),svg.focus .cl{opacity:.05}
svg.focus .nd:not(.hi){opacity:.22}
.edge.hi{opacity:1!important;stroke-width:2.6}
.nd.flash .core{animation:flash 1.2s ease-out 2}
@keyframes flash{0%{r:16;fill:#fff}100%{r:7}}
.panel{position:fixed;z-index:6;right:16px;top:64px;width:340px;max-height:calc(100% - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(10px);display:none;font-size:13.5px;line-height:1.65}
.panel.on{display:block;animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.panel h2{margin:0 0 4px;font-size:18px}.panel .x{float:right;cursor:pointer;color:var(--mut);background:none;border:0;font-size:18px}
.panel ul{padding-left:0;list-style:none;margin:8px 0}.panel li{padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.badge{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.b-lit{color:#fff;border-color:#67e8f9;box-shadow:0 0 8px rgba(103,232,249,.5)}.b-learning{color:var(--amber);border-color:var(--amber)}.b-mastered{color:var(--gold);border-color:var(--gold)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.7);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#0b1224;border:1px solid var(--line);border-radius:18px;padding:20px 22px;width:min(560px,100%);max-height:90vh;overflow:auto;font-size:14px;line-height:1.6}
.mbox h2{margin:0 0 10px;font-size:19px}
.mbox label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12.5px}
.mbox input,.mbox select,.mbox textarea{width:100%;background:#060b18;border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none}
.mlist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px;margin-top:6px}
.mlist label{display:flex;gap:8px;align-items:center;margin:2px 0;color:var(--ink);font-size:13.5px;cursor:pointer}
.mlist input{width:auto}
.row{display:flex;gap:6px;align-items:center}.row>*{flex:1}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.elist{font-size:12.5px;color:var(--mut);margin:6px 0}
#tl{position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at 50% 120%,#0b1a3a 0%,rgba(4,6,15,.96) 60%);display:none}
#tl.on{display:block;animation:fadein .5s}
@keyframes fadein{from{opacity:0}}
#tl svg{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab}
#tl .ttl{position:absolute;left:20px;top:16px;z-index:2;pointer-events:none}
#tl .ttl h2{margin:0;font-size:22px;letter-spacing:.08em}#tl .ttl p{margin:4px 0 0;color:var(--mut);font-size:13px;max-width:640px}
#tl .close{position:absolute;right:16px;top:16px;z-index:2}
.tl-era{font-size:13px;fill:#64748b}.tl-tick{font-size:12px;fill:#94a3b8}
.tl-st{cursor:pointer}.tl-st text{font-size:14px;fill:#e2e8f0;font-weight:600;paint-order:stroke;stroke:#04060f;stroke-width:4px}
.tl-st .sdate{font-size:11.5px;fill:#94a3b8;font-weight:400}
.tl-call{font-size:13px;fill:#fbbf24}
#cine{position:fixed;inset:0;z-index:30;background:#02030a;display:none;overflow:hidden}
#cine.on{display:block;animation:fadein .35s}
body.cine #map,body.cine #stars,body.cine .hud{visibility:hidden}
#cbg{position:absolute;inset:0;width:100%;height:100%}
#chead{position:absolute;left:18px;top:14px;right:18px;z-index:4;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);pointer-events:none}
#chead>*{pointer-events:auto}
#chead .crumb b{color:var(--ink)}
#cstage{position:absolute;left:0;right:0;top:44px;bottom:78px}
.scene{position:absolute;inset:0;display:none;padding:2vh 5vw;overflow:hidden}
.scene.on{display:block}
.sc-k{font-size:12.5px;letter-spacing:.35em;color:var(--cyan);margin-bottom:1.2vh}
.sc-h{font-size:clamp(22px,3.4vw,46px);font-weight:700;margin:0 0 2vh;letter-spacing:.04em}
.unc{color:var(--amber);font-weight:700;cursor:help}
.lab{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;margin-right:6px;vertical-align:2px;font-weight:600}
.lab-f{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.4)}
.lab-i{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
.s-title{display:flex!important;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.s-title:not(.on){display:none!important}
.s-title .no{font-size:clamp(70px,14vw,200px);font-weight:800;line-height:1;background:linear-gradient(180deg,#fff,rgba(103,232,249,.15));-webkit-background-clip:text;background-clip:text;color:transparent}
.s-title .ic{font-size:clamp(40px,6vw,80px);margin:1vh 0}
.s-title .nm{font-size:clamp(26px,4.4vw,64px);font-weight:700;letter-spacing:.08em}
.s-title .dt{color:var(--mut);margin-top:1.6vh;font-size:clamp(13px,1.3vw,17px);max-width:900px}
.s-title .core{margin-top:3vh;font-size:clamp(16px,1.9vw,26px);max-width:980px;line-height:1.6;min-height:2em}
.s-time svg{width:100%;height:58vh;display:block}
.ax-t{font-size:15px;fill:#94a3b8}.ax-st{font-size:18px;fill:#e2e8f0;font-weight:600}
.s-map{padding:0}
.s-map svg{position:absolute;inset:0;width:100%;height:100%}
.land{fill:#0f1d3a;stroke:#2c4a7d;stroke-width:.8;vector-effect:non-scaling-stroke}
.grat{stroke:rgba(103,232,249,.07);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.rg{fill:var(--amber);transform-box:fill-box;transform-origin:center}
.rg-glow{transform-box:fill-box;transform-origin:center}
.route{fill:none;stroke:#67e8f9;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round;filter:drop-shadow(0 0 4px #67e8f9)}
.rlab{fill:#fde68a;paint-order:stroke;stroke:#02030a;stroke-width:3px;font-weight:600}
.s-map .cap{position:absolute;left:5vw;bottom:3vh;max-width:min(560px,90vw);background:rgba(2,3,10,.7);padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-size:clamp(13px,1.2vw,16px);line-height:1.6}
.s-map .mtitle{position:absolute;left:5vw;top:2vh}
.s-map .explore{position:absolute;right:5vw;bottom:3vh}
.drv{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw;margin-top:2vh}
.dcard{background:linear-gradient(180deg,rgba(30,41,59,.65),rgba(15,23,42,.35));border:1px solid var(--line);border-radius:18px;padding:2.2vh 1.4vw;min-height:44vh}
.dcard .di{font-size:clamp(34px,4vw,60px);display:inline-block}
.dcard h3{margin:1vh 0;font-size:clamp(16px,1.6vw,22px)}
.dcard .chg{font-size:12.5px;color:var(--mut);margin-bottom:1vh}.dcard .chg b{color:var(--cyan);font-weight:600}
.dcard p{margin:0;font-size:clamp(13px,1.15vw,16px);line-height:1.7}
.facts{list-style:none;padding:0;margin:3vh 0 0;max-width:1100px}
.facts li{font-size:clamp(16px,2vw,28px);margin:2.4vh 0;line-height:1.5;padding-left:1.2em;border-left:3px solid rgba(52,211,153,.6)}
.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;margin-top:2vh}
.abc>div{border-radius:16px;padding:2.4vh 1.4vw;min-height:40vh;border:1px solid var(--line)}
.abc .A{background:rgba(124,58,237,.14)}.abc .B{background:rgba(180,83,9,.14)}.abc .C{background:rgba(29,78,216,.16)}
.abc h3{margin:0 0 1.4vh;font-size:clamp(16px,1.7vw,24px)}.abc p{margin:0;font-size:clamp(14px,1.3vw,18px);line-height:1.75}
.ew{position:absolute;inset:0;display:flex}
.ew>.E,.ew>.W{flex:1;padding:6vh 4vw;display:flex;flex-direction:column;justify-content:center}
.ew .E{background:linear-gradient(90deg,rgba(220,38,38,.16),rgba(220,38,38,0))}
.ew .W{background:linear-gradient(270deg,rgba(37,99,235,.18),rgba(37,99,235,0))}
.ew h3{font-size:clamp(20px,2.6vw,36px);margin:0 0 2vh}
.ew p{font-size:clamp(14px,1.35vw,19px);line-height:1.8;margin:0}
.ew .mid{position:absolute;left:50%;top:8%;bottom:8%;width:2px;background:linear-gradient(180deg,transparent,#fde68a,transparent);transform-origin:top}
.icards{display:flex;flex-direction:column;gap:2vh;margin-top:2vh;max-width:1100px}
.icard{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.28);border-radius:14px;padding:1.8vh 1.6vw;font-size:clamp(14px,1.35vw,19px);line-height:1.7}
.icard .who{font-weight:700;color:var(--gold);margin-right:6px}
.s-next .nx{font-size:clamp(18px,2.4vw,34px);line-height:1.6;max-width:1100px;margin-top:2vh}
.s-next svg{width:100%;height:22vh;margin-top:3vh}
.s-next .go{margin-top:2vh}
.qz{max-width:980px;margin:0 auto;height:100%;overflow-y:auto}
.q{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:14px;padding:1.6vh 1.4vw;margin:1.4vh 0}
.q .qt{font-size:clamp(14px,1.4vw,18px);margin-bottom:1vh}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;background:rgba(2,6,23,.6);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:clamp(13px,1.15vw,15.5px)}
.opt:hover{border-color:#67e8f9}.opt.ok{border-color:#34d399;background:rgba(52,211,153,.15)}.opt.no{border-color:#fb7185;background:rgba(251,113,133,.12)}
.q .ex{font-size:13px;color:var(--mut);margin-top:8px;display:none}.q.done .ex{display:block}
.qres{text-align:center;font-size:18px;margin-top:2vh;min-height:1.6em}
.litmsg{color:#fff;text-shadow:0 0 16px #67e8f9,0 0 30px #67e8f9;font-weight:700}
#cbar{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:5;background:linear-gradient(0deg,rgba(2,3,10,.96),rgba(2,3,10,.4));display:flex;align-items:center;gap:10px;padding:0 18px}
#cbar .cb{background:rgba(30,41,59,.7);border:1px solid var(--line);border-radius:99px;min-width:40px;height:40px;cursor:pointer;font-size:15px;padding:0 12px}
#cbar .cb.play{min-width:52px;height:52px;font-size:18px;background:linear-gradient(135deg,#0e7490,#6d28d9);border:0}
#ctime{font-size:12.5px;color:var(--mut);min-width:88px;text-align:center;font-variant-numeric:tabular-nums}
#scrub{flex:1;position:relative;height:44px;cursor:pointer;touch-action:none}
#scrub .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:rgba(148,163,184,.2)}
#scrub .fl{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,#67e8f9,#a78bfa)}
#scrub .kn{position:absolute;top:7px;width:16px;height:16px;border-radius:50%;background:#fff;margin-left:-8px;box-shadow:0 0 10px #67e8f9}
#scrub .ch{position:absolute;top:8px;width:2px;height:14px;background:rgba(226,232,240,.5)}
#scrub .chl{position:absolute;top:24px;font-size:10.5px;color:var(--mut);transform:translateX(3px);white-space:nowrap;cursor:pointer}
#scrub .chl.cur{color:var(--cyan)}
#burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--cyan);padding:8px 16px;border-radius:99px;font-size:14px;box-shadow:0 0 18px rgba(103,232,249,.4);transition:opacity .5s}
@media (max-width:760px){
 .brand h1{font-size:16px}#search{width:110px}.tools .btn{padding:5px 9px;font-size:12px}
 .panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:55%}
 .drv{grid-template-columns:1fr 1fr}.dcard{min-height:auto}
 .abc{grid-template-columns:1fr}.abc>div{min-height:auto}
 .ew{flex-direction:column}.ew .mid{display:none}.ew>.E,.ew>.W{padding:2vh 5vw}
 .opts{grid-template-columns:1fr}
 #scrub .chl{display:none}#ctime{display:none}#cbar{gap:6px;padding:0 8px}
 .scene{overflow-y:auto}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<svg id="map" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="gLit"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#a5f3fc" stop-opacity=".55"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  <radialGradient id="gGold"><stop offset="0" stop-color="#fff7d6" stop-opacity=".95"/><stop offset=".3" stop-color="#fde68a" stop-opacity=".55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <radialGradient id="gReg"><stop offset="0" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
 </defs>
 <g id="cam"></g>
</svg>
<div class="hud" id="top">
 <div class="brand"><h1>学者 · 知识地图</h1><span class="cnt" id="cnt"></span></div>
 <div class="tools">
  <input id="search" list="names" placeholder="🔍 搜索节点 / topic"><datalist id="names"></datalist>
  <button class="btn pri" id="bTl">⏳ 时间轴</button>
  <button class="btn" id="bCiv">📜 文明通史</button>
  <button class="btn" id="bNew">＋ 新建 topic</button>
  <button class="btn" id="bExp">导出</button>
  <button class="btn" id="bImp">导入</button><input type="file" id="fImp" accept="application/json,.json" hidden>
  <button class="btn" id="bHome">全图</button>
  <button class="btn" id="bLeg">图例</button>
 </div>
</div>
<div class="hud" id="legend">
 <span><i style="background:#fbbf24"></i>铺垫下一步</span><span><i style="background:#fb7185"></i>导致</span><span><i style="background:#67e8f9"></i>相关</span><span><i style="background:#a78bfa"></i>建议先学</span><span><i style="background:#f472b6"></i>对照</span><span><i style="background:#f0abfc"></i>我的 topic 成员</span>
 <span>｜</span><span><i class="dot" style="background:#94a3b8;opacity:.5"></i>未学</span><span><i class="dot" style="background:#e2e8f0"></i>看过</span><span><i class="dot" style="background:#fde68a"></i>学习中</span><span><i class="dot" style="background:#fff;box-shadow:0 0 8px #67e8f9"></i>已点亮</span><span><i class="dot" style="background:#fde68a;box-shadow:0 0 8px #f59e0b"></i>已掌握</span><span><i class="dot" style="background:#94a3b8;opacity:.2"></i>前置未亮</span>
</div>
<div class="hud" id="hint">滚轮 / 双指缩放 · 拖动平移 · 点星进入</div>
<div id="tip"></div>

":"定居、储藏 → 财产与继承 → 村落；不平等逐步扩大。"}],"abc":{"A":"陶器、祖先崇拜、纪念性建筑；贾湖骨笛约 9000 年前。","B":"财产、继承、等级出现；土耳其哥贝克力石阵（约 1.16 万年前起）早于成熟农业，引出「仪式/信仰先于农业？」的讨论（⚠）。","C":"驯化动植物、剩余、人口增长；人畜共患病增加；多地骨骼显示早期农人营养与健康一度变差。"},"east":"中国是独立起源中心之一：华北粟、黍（约 1 万–8000 年前），长江流域稻作的驯化是数千年的渐进过程（约 9000–6000 年前，⚠ 时间节点有争议）。","west":"新月沃地：小麦、大麦、豆类及羊、牛驯化约 1.15 万–1 万年前起；美洲（玉米、马铃薯）、新几内亚等地也独立发生。","facts":["农业起源是多中心、渐进的，不是一次事件","新月沃地是已知最早的中心之一","中国北方粟作、南方稻作是两个独立传统"],"interp":[{"who":"戴蒙德《枪炮、病菌与钢铁》","text":"欧亚大陆东西轴向、可驯化物种多，所以农业与技术更易传播——地理解释，被批评为过度决定论。"},{"who":"赫拉利","text":"「史上最大的骗局」：个体生活变差、物种数量变多——修辞化的解释。"},{"who":"詹姆斯·斯科特《反谷》","text":"谷物易计量、易征税，所以和早期国家绑在一起——政治人类学解释。"}],"next":"稳定的剩余能养活不种地的人（祭司、工匠、武士、管理者），城市与国家的底座有了。","lenses":["C","B"],"weeks":["W7","W1"],"drivers":{"能量":"驯化太阳能（作物、牲畜）","信息载体":"历法、陶器符号","协作规模":"村落","观念":"祖先、丰产"},"quiz":[{"q":"关于农业起源，哪项是本页列出的事实？","options":["只在新月沃地发生一次","多中心、渐进发生","先有文字后有农业","由一位发明家完成"],"answer":1,"explain":"农业起源是多中心、渐进的，不是一次事件。"},{"q":"中国北方与南方的早期农业传统分别是？","options":["小麦 / 玉米","粟黍 / 稻作","稻作 / 粟黍","大麦 / 马铃薯"],"answer":1,"explain":"华北粟、黍，长江流域稻作，是两个独立传统。"},{"q":"「农业是史上最大的骗局」是谁的说法、性质如何？","options":["戴蒙德，考古事实","赫拉利，修辞化的解释","斯科特，学界共识","柴尔德，测年数据"],"answer":1,"explain":"赫拉利的修辞化解释，不是事实陈述。"}],"summary":"从「找食物」变成「生产食物」：人定居下来，同一块地能养活多得多的人。"},{"id":"s3","kind":"node","node_type":"era","name":"城市、国家与文字","short":"城市·国家·文字","icon":"📜","domain":"d-hist","home_topic":"t-civ","status":"ready","no":3,"dates":"≈前4000–前1000（各地先后）","ya":[6000,3000],"mark":5200,"core":"人类第一次学会管理成千上万的陌生人：靠城市、王权、官僚，以及把信息写下来。","mech":[{"k":"能量","v":"灌溉农业剩余；青铜冶炼；轮子（约前 3500 年）、犁与畜力。"},{"k":"信息","v":"文字：两河早期楔形文字泥板大多是行政记账；文字让税收、法律、历法可以跨越时间与距离。"},{"k":"组织","v":"王权 + 神庙 + 书吏官僚 + 常备武力；「国家」作为专业化的强制与再分配机器出现。"}],"abc":{"A":"史诗（《吉尔伽美什》）、历法、文学与纪念性艺术；文字让叙事能被固定下来。","B":"神王或王权神授、神庙经济、成文法（《汉穆拉比法典》约前 1754 年）；西周的「天命」观念。","C":"青铜器、轮子、灌溉网络、手工业专业化、长距离贸易。"},"east":"良渚（约前 3300–前 2300）有大型水利和城址，被许多学者视为早期国家（⚠ 有争议）；二里头（约前 1750–前 1530）与「夏」是否对应仍有争议；殷墟甲骨文（约前 1250–前 1050）是目前公认最早的成体系汉字，内容以王室占卜为主；周约前 1046 年代商（⚠ 断代工程的推定年）。","west":"苏美尔乌鲁克（约前 4000–前 3100）；楔形文字与埃及圣书字约前 3200 年；埃及统一约前 3100 年；印度河文明（约前 2600–前 1900 成熟期，文字未破译）；腓尼基字母约前 1050 年，后来演变出希腊、拉丁字母。","facts":["两河最早的原始楔形文字泥板以行政、经济记录为主","甲骨文是商代晚期王室的占卜记录","东地中海青铜时代晚期体系约前 1200–前 1150 年崩溃"],"interp":[{"who":"对照观察","text":"西方早期文字以记账为主，中国现存最早的文字以占卜为主——但竹木简易腐，⚠ 可能有材料保存造成的幸存者偏差。"},{"who":"斯科特 / 柴尔德「城市革命」","text":"城市、国家、文字是一揽子出现的——经典框架，细节各地差异很大。"}],"next":"书写阶层与跨国竞争积累到一定程度后，有人开始反思「人该怎么活、什么是对的」，这就是轴心时代。","lenses":["A","B","C"],"weeks":["W1","W5","W7"],"drivers":{"能量":"灌溉剩余 + 青铜","信息载体":"文字（记账、占卜）","协作规模":"城邦、早期国家","观念":"神王、天命"},"quiz":[{"q":"两河流域最早的原始楔形文字泥板，内容以什么为主？","options":["史诗","王室占卜","行政与经济记录","宗教经典"],"answer":2,"explain":"以行政、经济记录为主；甲骨文才以占卜为主。"},{"q":"《汉穆拉比法典》大约在什么时候？","options":["约前 3200 年","约前 1754 年","约前 508 年","约公元 313 年"],"answer":1,"explain":"约前 1754 年。"},{"q":"目前公认最早的成体系汉字是？","options":["良渚刻符","二里头陶文","殷墟甲骨文","秦小篆"],"answer":2,"explain":"殷墟甲骨文，约前 1250–前 1050。"}],"summary":"人类第一次学会管理成千上万的陌生人：靠城市、王权、官僚，以及把信息写下来。"},{"id":"s4","kind":"node","node_type":"era","name":"轴心时代：思想的突破","short":"轴心时代","icon":"💭","domain":"d-hist","home_topic":"t-civ","status":"ready","no":4,"dates":"≈前800–前200（雅斯贝尔斯的划分）","ya":[2826,2226],"mark":2526,"core":"几个文明几乎同时出现超越王权与部落的普遍伦理、哲学和反思传统。","mech":[{"k":"能量","v":"铁器推广，农业和战争的规模扩大。"},{"k":"信息","v":"书写与经典文本扩散；铸币（吕底亚约前 7 世纪末–前 6 世纪；中国春秋布币）促进市场与流动。"},{"k":"组织","v":"诸国林立、竞争激烈：游士、城邦公民、僧团等不依附单一宫廷的知识人出现。"}],"abc":{"A":"哲学与批判性反思：儒、道、墨、法；佛教与耆那教；希腊哲学；希伯来先知传统。","B":"出现了高于君主的道德标准（天道、法、上帝、达摩），后来成为评判统治是否正当的依据。","C":"铁器、铸币、城市市场；中国很早掌握生铁铸造（约前 6–前 5 世纪起）。"},"east":"春秋战国（前 770–前 221）百家争鸣；孔子（前 551–前 479）；老子年代 ⚠ 有争议；印度：佛陀约公元前 5 世纪（⚠ 传统说法与学界推定相差近百年）。","west":"希腊城邦与雅典民主（克里斯提尼改革约前 508/507）；苏格拉底（前 469–前 399）、柏拉图、亚里士多德（前 384–前 322）；犹太人「巴比伦之囚」（前 586–前 539）之后，经典逐渐成形。","facts":["孔子、佛陀（约）、苏格拉底大致处在同一个公元前千年的中段","「轴心时代」一词来自雅斯贝尔斯《历史的起源与目标》（1949）"],"interp":[{"who":"雅斯贝尔斯","text":"轴心时代是人类精神的共同突破——解释框架，被批评过于整齐、以欧洲为中心。"},{"who":"Baumard 等（2015）「富足假说」","text":"生活水平跨过某个门槛之后，人开始重视长期与节制——有争议的量化解释。"}],"next":"这些思想随后被帝国吸收为治理意识形态或国教（儒学、佛教、基督教），从思想变成了秩序。","lenses":["A","B"],"weeks":["W2","W4"],"drivers":{"能量":"铁器扩散","信息载体":"经典文本","协作规模":"诸国竞争","观念":"超越性伦理"},"quiz":[{"q":"「轴心时代」这个词出自谁？","options":["黑格尔","雅斯贝尔斯","汤因比","韦伯"],"answer":1,"explain":"雅斯贝尔斯《历史的起源与目标》（1949）。"},{"q":"孔子的生卒年是？","options":["前 551–前 479","前 469–前 399","前 384–前 322","前 770–前 221"],"answer":0,"explain":"前 469–前 399 是苏格拉底，前 384–前 322 是亚里士多德。"},{"q":"「轴心时代是人类精神的共同突破」应当怎样标注？","options":["事实","解释框架，被批评过于整齐","测年数据","已被证伪"],"answer":1,"explain":"它是解释框架，被批评过于整齐、以欧洲为中心。"}],"summary":"几个文明几乎同时出现超越王权与部落的普遍伦理、哲学和反思传统。"},{"id":"s5","kind":"node","node_type":"era","name":"帝国与丝路网络","short":"帝国·丝路","icon":"🏛️","domain":"d-hist","home_topic":"t-civ","status":"ready","no":5,"dates":"≈前550–公元600","ya":[2576,1426],"mark":2247,"core":"大帝国学会用官僚、法律、道路、文字和共同信仰，长期统治数千万陌生人；横贯欧亚的交换网络连通。","mech":[{"k":"能量","v":"农业税赋 + 灌溉、运河；铁农具普及。"},{"k":"信息","v":"统一文字和度量、法典、驿传、户籍。"},{"k":"组织","v":"郡县与行省、常备军、职业官僚；帝国采纳普世宗教或学说作为凝聚力。"}],"abc":{"A":"古典经典定型（儒家经学、希腊化文化、拉丁文学）；佛教艺术沿丝路东传。","B":"秦郡县制、汉代儒学官方化；罗马法与公民权；阿育王推广佛教；基督教 313 年获合法地位，380 年成为罗马国教。","C":"道路与运河网、货币经济、丝路贸易；传染病也沿着网络传播（安东尼瘟疫 165–180 年、查士丁尼瘟疫 541 年起）。"},"east":"秦统一（前 221）：书同文、车同轨、郡县制；汉（前 202–公元 220）；张骞约前 138 年起出使西域；佛教约公元 1 世纪传入；隋（581 年建立，589 年统一）重新统一中国。","west":"波斯阿契美尼德（约前 550–前 330）；亚历山大（死于前 323）；印度孔雀王朝（约前 322–前 185）；罗马帝国（前 27 年起），西罗马 476 年终结，东罗马延续至 1453 年。","facts":["「丝绸之路」一词是李希霍芬 1877 年才提出的","西罗马分裂后再也没有重新统一；中国在长期分裂后，于 589 年重新统一"],"interp":[{"who":"库马尔《千年帝国史》","text":"帝国是一套「统治多样性」的工具箱，跟民族国家的逻辑不同——比较史框架。"},{"who":"沙伊德尔《逃离罗马》","text":"欧洲长期碎片化、彼此竞争，是它后来崛起的前提——解释，争议大。"}],"next":"西方走向碎片化，教会成为跨国机构；东方维持统一的官僚帝国；伊斯兰世界在两者之间崛起。三条路径分开了。","lenses":["B","C","A"],"weeks":["W5","W4"],"drivers":{"能量":"帝国税赋 + 运河","信息载体":"统一文字、法典、驿传","协作规模":"大帝国","观念":"普世宗教 / 国家学说"},"quiz":[{"q":"「丝绸之路」一词何时由谁提出？","options":["张骞，前 138 年","李希霍芬，1877 年","马可·波罗，13 世纪","司马迁，汉代"],"answer":1,"explain":"李希霍芬 1877 年才提出这个词。"},{"q":"基督教何时成为罗马国教？","options":["313 年","380 年","476 年","1453 年"],"answer":1,"explain":"313 年获合法地位，380 年成为国教。"},{"q":"中国在长期分裂后于哪一年重新统一？","options":["前 221 年","220 年","589 年","960 年"],"answer":2,"explain":"隋 581 年建立，589 年统一。"}],"summary":"大帝国学会用官僚、法律、道路、文字和共同信仰，长期统治数千万陌生人；横贯欧亚的交换网络连通。"},{"id":"s6","kind":"node","node_type":"era","name":"中世纪、伊斯兰世界与宋代商业革命","short":"中世纪·宋","icon":"🪙","domain":"d-hist","home_topic":"t-civ","status":"ready","no":6,"dates":"≈600–1450","ya":[1426,576],"mark":1026,"core":"世界宗教塑造了各大文明的秩序；同期宋代中国出现了前所未有的商业化、货币化和印刷文化。","mech":[{"k":"能量","v":"水磨、马具与三圃制（欧洲）；宋代引入占城稻（1012 年），冶铁业大量用煤（⚠ 具体规模的估计有争议）。"},{"k":"信息","v":"造纸术 8 世纪传入伊斯兰世界；雕版印刷盛于唐宋；毕昇活字约 1040 年代（见沈括《梦溪笔谈》）。"},{"k":"组织","v":"欧洲：教会与王权双重权威、大学、行会、城市自治；中国：科举官僚加士大夫；伊斯兰：商法与跨区域商网。"}],"abc":{"A":"经院哲学、伊斯兰世界的翻译运动（8–10 世纪）、宋明理学（朱熹 1130–1200）。","B":"伊斯兰教兴起（622 年迁徙）；1054 年东西教会分裂；叙任权之争（1075–1122）；《大宪章》1215 年；科举制自隋唐起逐步成形。","C":"宋代商业革命：官方交子（1020 年代）、市镇、海外贸易；欧洲：农业扩张、商业复兴、香槟集市。"},"east":"唐（618–907）、宋（960–1279）：火药配方见于《武经总要》（1044），指南针用于航海见于《萍洲可谈》（12 世纪初）；蒙古帝国（1206 年起）与元（1271–1368）打通欧亚。","west":"查理曼加冕（800）；封建制（这个概念本身被史学界反复检讨）；大学（博洛尼亚，传统定为 1088 年）；黑死病（1347–1351）造成欧洲约 30%–60% 人口死亡（估计区间）。","facts":["交子是世界上最早由政府发行的纸币之一","黑死病沿着蒙古时代的欧亚网络传播"],"interp":[{"who":"内藤湖南「唐宋变革论」","text":"宋代是中国「近世」的开端——日本京都学派的解释，影响很大，也有人质疑。"},{"who":"李筠《中世纪》","text":"教会与王权的长期张力孕育了法治、代议和个人权利——制度史解释。"}],"next":"蒙古网络把火药、罗盘和瘟疫带向西方；葡萄牙 15 世纪初就开始沿非洲西岸南下，伊比利亚人带着新式帆船寻找通往亚洲的海路（1453 年君士坦丁堡陷落常被说成「逼出」大航海，⚠ 这是简化说法）。","lenses":["B","C","A"],"weeks":["W4","W5","W3"],"drivers":{"能量":"水磨、占城稻、煤（宋）","信息载体":"纸、雕版、活字","协作规模":"教会 / 科举官僚 / 商网","观念":"宗教秩序、理学"},"quiz":[{"q":"交子是什么？","options":["宋代官方发行的纸币之一","唐代铜钱","蒙古驿站","欧洲汇票"],"answer":0,"explain":"交子是世界上最早由政府发行的纸币之一（1020 年代官方化）。"},{"q":"黑死病大约造成欧洲多少人口死亡（估计区间）？","options":["约 5%","约 30%–60%","约 90%","几乎没有影响"],"answer":1,"explain":"1347–1351，约 30%–60%（估计区间）。"},{"q":"内藤湖南「唐宋变革论」的性质是？","options":["史料原文","日本京都学派的解释","考古发现","法律条文"],"answer":1,"explain":"影响很大的解释，也有人质疑。"}],"summary":"世界宗教塑造了各大文明的秩序；同期宋代中国出现了前所未有的商业化、货币化和印刷文化。"},{"id":"s7","kind":"node","node_type":"era","name":"大航海与第一次全球化","short":"大航海","icon":"⛵","domain":"d-hist","home_topic":"t-civ","status":"ready","no":7,"dates":"≈1400–1650","ya":[626,376],"mark":534,"core":"海路第一次把各大洲连成一个交换网络，白银、作物、病菌和人口开始在全球流动。","mech":[{"k":"能量","v":"风帆与远洋船，火药武器。"},{"k":"信息","v":"古登堡印刷（约 1450 年代）带来书籍和地图的爆发；航海术与制图术进步。"},{"k":"组织","v":"国家特许的冒险事业、股份公司（荷兰东印度公司 1602 年成立）、殖民地体系。"}],"abc":{"A":"文艺复兴（14–16 世纪意大利起）；印刷使知识大量扩散；「新世界」冲击了欧洲旧有的世界观。","B":"宗教改革（1517 年路德）→「教随国定」（1555 年奥格斯堡和约）→ 1648 年威斯特伐利亚和约；殖民帝国建立。","C":"哥伦布交换（克罗斯比 1972 年提出的概念）：美洲作物传到亚非欧，旧大陆病菌造成美洲原住民人口大规模崩溃（⚠ 规模估计差异很大）；跨大西洋奴隶贸易约 1250 万人被运上船（跨大西洋奴隶贸易数据库的估计）。"},"east":"郑和七下西洋（1405–1433）后，明朝转向收缩；一条鞭法（张居正 1581 年推广至全国）以白银征税，美洲和日本白银大量流入中国；玉米、番薯在 16 世纪传入中国。","west":"1492 年哥伦布到达美洲；1498 年达伽马抵达印度；1519–1522 年麦哲伦–埃尔卡诺船队完成环球航行；1521 年特诺奇蒂特兰陷落；1571 年西班牙建马尼拉，大帆船贸易把美洲和亚洲接了起来。","facts":["大量美洲白银最终流入中国","郑和船队早于哥伦布，但没有后续扩张"],"interp":[{"who":"Flynn & Giráldez","text":"以 1571 年马尼拉建城为全球化「诞生」——解释性定年。"},{"who":"为何明停航而欧洲出海","text":"财政与边防优先 vs 欧洲多国竞争——多种解释并存。"}],"next":"新的数据、新的仪器、印刷网络和海外财富汇在一起，为科学革命提供了土壤。","lenses":["C","B","A"],"weeks":["W3","W6"],"drivers":{"能量":"风帆跨洋","信息载体":"古登堡印刷、地图","协作规模":"特许公司、殖民帝国","观念":"人文主义、宗教改革"},"quiz":[{"q":"郑和下西洋与哥伦布到达美洲，哪个更早？","options":["哥伦布（1492）","郑和（1405–1433）","同一年","史料无法判断"],"answer":1,"explain":"郑和船队早于哥伦布，但没有后续扩张。"},{"q":"大量美洲白银最终主要流向哪里？","options":["西班牙","英国","中国","印度"],"answer":2,"explain":"一条鞭法以白银征税，美洲和日本白银大量流入中国。"},{"q":"「以 1571 年马尼拉建城为全球化诞生」属于？","options":["事实","解释性定年（Flynn & Giráldez）","法律文件","考古测年"],"answer":1,"explain":"解释性定年。"}],"summary":"海路第一次把各大洲连成一个交换网络，白银、作物、病菌和人口开始在全球流动。"},{"id":"s8","kind":"node","node_type":"era","name":"科学革命与启蒙","short":"科学·启蒙","icon":"🔭","domain":"d-hist","home_topic":"t-civ","status":"ready","no":8,"dates":"≈1543–1800","ya":[483,226],"mark":339,"core":"人类发明了一套能系统纠错的求知方法（实验、数学、公开发表），并开始用理性重新论证政治的正当性。","mech":[{"k":"能量","v":"这一阶段能源结构还没变；变的是关于自然的知识。"},{"k":"信息","v":"印刷、期刊、望远镜和显微镜、数学化 → 知识可以复制、检验、累积。"},{"k":"组织","v":"科学学会（英国皇家学会 1660 年）、「文人共和国」通信网、沙龙与咖啡馆形成的公共领域。"}],"abc":{"A":"哥白尼（1543）、伽利略、牛顿《原理》（1687）；《百科全书》（1751–1772）；「进步」成为主导叙事（课程 W3 会讨论它是不是一种发明）。","B":"洛克《政府论》（1689）、社会契约、权利、宪政；美国独立（1776）、法国大革命（1789）；斯密《国富论》（1776）。","C":"为工业革命准备了「有用知识」；农业改良运动。"},"east":"利玛窦 1601 年进入北京；徐光启与利玛窦合译《几何原本》前六卷（1607）；清代考据学兴起；《四库全书》编纂（1773–1782）。","west":"科学从个人好奇变成有制度保障的事业；启蒙在英国、法国、苏格兰、德意志各有不同的版本。","facts":["《原理》出版于 1687 年","《几何原本》前六卷中译本于 1607 年刊行"],"interp":[{"who":"李约瑟问题","text":"为何近代科学没有在中国产生？——问题本身的预设也受到批评。"},{"who":"彭慕兰《大分流》（2000）","text":"约 1800 年前江南与英格兰发展水平相当，是煤和殖民地造成了分流——加州学派的解释，有对立观点。"},{"who":"Mokyr「工业启蒙」","text":"把知识当作可以公开交流的公共品，这一观念推动了工业革命——解释。"}],"next":"有用知识遇上廉价煤炭，加上革命塑造的「人民」，就是工业革命和民族国家。","lenses":["A","B"],"weeks":["W3","W6"],"drivers":{"能量":"（能源未变，知识变）","信息载体":"期刊、仪器、数学","协作规模":"学会、文人共和国","观念":"自然法则、权利、进步"},"quiz":[{"q":"牛顿《原理》出版于哪一年？","options":["1543","1607","1687","1776"],"answer":2,"explain":"1687 年；1543 是哥白尼，1607 是《几何原本》中译。"},{"q":"徐光启与利玛窦合译《几何原本》前六卷刊行于？","options":["1601","1607","1660","1773"],"answer":1,"explain":"1607 年。"},{"q":"彭慕兰《大分流》的观点应当标作？","options":["事实","加州学派的解释，有对立观点","官方统计","已成定论"],"answer":1,"explain":"约 1800 年前江南与英格兰相当、煤和殖民地造成分流——一种解释。"}],"summary":"人类发明了一套能系统纠错的求知方法（实验、数学、公开发表），并开始用理性重新论证政治的正当性。"},{"id":"s9","kind":"node","node_type":"era","name":"工业革命与民族国家","short":"工业·民族国家","icon":"⚙️","domain":"d-hist","home_topic":"t-civ","status":"ready","no":9,"dates":"≈1760–1914（英国 ≈1760–1840 为第一阶段）","ya":[266,112],"mark":257,"core":"化石能源让人类第一次挣脱了「有机经济」的能量天花板；民族国家成为组织大众的默认方式。","mech":[{"k":"能量","v":"煤与蒸汽机（瓦特分离式冷凝器专利 1769 年）：从依赖每年的光合作用，转向开采亿万年储存下来的太阳能。"},{"k":"信息","v":"电报（1840 年代）、大众报刊、义务教育和识字率提升。"},{"k":"组织","v":"工厂制与工资劳动、股份公司、铁路网（1830 年利物浦–曼彻斯特铁路）；征兵制和国民教育塑造了「国民」。"}],"abc":{"A":"浪漫主义、民族主义、大众印刷文化；「时间纪律」进入日常生活。","B":"民族国家（意大利 1861 年、德国 1871 年统一）、公民权、代议制；同时期殖民帝国达到顶峰。","C":"纺织机械化、蒸汽、铁路、城市化；人均收入开始持续增长（⚠ 起点与速度有学术争议）。"},"east":"鸦片战争（1840–1842）；太平天国（1850–1864）；洋务运动（约 1861–1895）；日本明治维新（1868）；甲午战争（1894–1895）；1905 年废科举；1911 年辛亥革命，1912 年中华民国成立。","west":"英国率先工业化，比利时、德国、美国随后跟进；1848 年欧洲革命；马克思《资本论》第一卷 1867 年出版。","facts":["英国是第一个工业化国家","中国 1905 年废除科举"],"interp":[{"who":"Robert Allen","text":"英国工资高、煤便宜，用机器替代人工最划算——经济史解释。"},{"who":"Wrigley「有机经济」","text":"工业化之前的增长受土地光合作用的上限约束——框架。"},{"who":"安德森《想象的共同体》/ 盖尔纳","text":"民族是印刷资本主义和工业社会的产物——解释。"}],"next":"科学开始直接驱动产业（化学、电力），列强在全球竞争，最后撞上了总体战。","lenses":["C","B","A"],"weeks":["W8","W6"],"drivers":{"能量":"煤与蒸汽：化石能源","信息载体":"电报、报刊、义务教育","协作规模":"工厂、民族国家","观念":"民族、阶级、进化"},"quiz":[{"q":"工业革命在能量上的本质变化是？","options":["更多使用风力","从每年的光合作用转向开采储存的化石能源","发明电网","大规模使用核能"],"answer":1,"explain":"从依赖每年的光合作用，转向开采亿万年储存下来的太阳能。"},{"q":"中国在哪一年废除科举？","options":["1840","1868","1905","1912"],"answer":2,"explain":"1905 年。"},{"q":"「民族是印刷资本主义和工业社会的产物」出自谁、什么性质？","options":["马克思，事实","安德森 / 盖尔纳，解释","斯密，统计","瓦特，专利"],"answer":1,"explain":"《想象的共同体》/ 盖尔纳的解释。"}],"summary":"化石能源让人类第一次挣脱了「有机经济」的能量天花板；民族国家成为组织大众的默认方式。"},{"id":"s10","kind":"node","node_type":"era","name":"电气化、世界大战与信息革命","short":"电气·大战·信息","icon":"⚡","domain":"d-hist","home_topic":"t-civ","status":"ready","no":10,"dates":"≈1870–2010","ya":[156,16],"mark":79,"core":"电力、石油和大公司把生产推到全球规模；两次世界大战重塑了国际秩序；计算机和互联网把信息变成主要的生产资料。","mech":[{"k":"能量","v":"石油与电网（爱迪生珍珠街电站 1882 年）；哈伯–博施合成氨（1913 年工业化）支撑了人口增长。"},{"k":"信息","v":"电话、广播、电视 → 晶体管（1947）→ 集成电路（1958–1959）→ ARPANET（1969）→ 万维网（1989 年提出）→ 智能手机（2007）。"},{"k":"组织","v":"福特流水线（1913）、跨国公司、总体战动员、福利国家；联合国（1945）、布雷顿森林体系（1944）。"}],"abc":{"A":"大众传媒、现代主义、消费文化；全球同步观看同一个画面。","B":"意识形态竞争（自由主义、共产主义、法西斯主义）；一战（1914–1918）、二战（1939–1945）；1945 年后去殖民化；冷战（约 1947–1991）。","C":"电气化、化工、汽车、绿色革命、计算机；1950 年后人口与能源消耗急剧加速。"},"east":"1919 年五四运动；1949 年中华人民共和国成立；1978 年改革开放；2001 年加入世贸组织，中国成为「世界工厂」。","west":"美国在第二次工业革命中领先；战后西欧一体化；硅谷与个人电脑、互联网。","facts":["晶体管 1947 年在贝尔实验室发明","第二次世界大战 1939–1945"],"interp":[{"who":"Robert Gordon","text":"1870–1970 年的「一次大浪潮」比信息革命更深刻——有争议的经济史判断。"},{"who":"霍布斯鲍姆「短 20 世纪」","text":"1914–1991 构成一个整体——史学分期解释。"}],"next":"万物数字化留下了海量数据，加上算力增长，机器开始做「认知工作」。","lenses":["C","B","A"],"weeks":["W9","W6"],"drivers":{"能量":"石油与电网","信息载体":"广播 → 计算机 → 互联网","协作规模":"跨国公司、联合国","观念":"意识形态之争"},"quiz":[{"q":"晶体管发明于哪一年、在哪里？","options":["1913，福特工厂","1947，贝尔实验室","1969，ARPANET","1989，CERN"],"answer":1,"explain":"1947 年在贝尔实验室。"},{"q":"哈伯–博施合成氨工业化的意义是？","options":["支撑人口增长的化肥","发明电报","推动大航海","建立联合国"],"answer":0,"ex <script>

/* ---- user layer (localStorage) ---- */

/* ---- layout ---- */
var P={};
function layout(){
 P={};var nd=W.domains.length;
 W.domains.forEach(function(d,i){
  var a=i/nd*Math.PI*2-Math.PI/2, big=d.id==='d-hist';

   if(t.id==='t-civ'){tx=cx+Math.cos(a)*90;ty=cy+Math.sin(a)*90}
   P[t.id]={x:tx,y:ty};
   t.members.forEach(function(m,k){
    if(t.id==='t-civ'){var aa=a+Math.PI*1.08+k/(t.members.length-1)*Math.PI*1.84;var rr=215+k*8;P[m]={x:tx+Math.cos(aa)*rr,y:ty+Math.sin(aa)*rr}}
    else{var ba=ta+(k-(t.members.length-1)/2)*0.9;P[m]={x:tx+Math.cos(ba)*95,y:ty+Math.sin(ba)*95}}
   });
  });
 });
 U.topics.forEach(function(t){var d=P[t.domain]||{x:0,y:0,a:0};var cnt=U.topics.filter(function(x){return x.domain===t.domain});var j=cnt.indexOf(t);var a=d.a+(j-(cnt.length-1)/2)*0.35;var r=(t.domain==='d-hist'?760:560);P[t.id]={x:d.x+Math.cos(a)*r,y:d.y+Math.sin(a)*r}});

var svg=$('map'),cam=$('cam'),C={x:0,y:0,k:.3};

 var gN=el('g',{},cam),gC=el('g',{},cam),gE=el('g',{},cam),gU=el('g',{},cam),gT=el('g',{},cam),gD=el('g',{},cam),gS=el('g',{},cam),gL=el('g',{},cam);

  el('stop',{offset:'0','stop-color':d.color,'stop-opacity':'.26'},rg);el('stop',{offset:'.55','stop-color':d.color,'stop-opacity':'.08'},rg);el('stop',{offset:'1','stop-color':d.color,'stop-opacity':'0'},rg);
  var c=el('circle',{cx:p.x,cy:p.y,r:p.r,fill:'url(#'+gid+')',class:'neb'},gN);

 });
 allTopics().forEach(function(t){
  var p=P[t.id];if(!p)return;var user=t.id.indexOf('u-')===0;

  var g=el('g',{class:user?'utop':''},gT);
  el('circle',{cx:p.x,cy:p.y,r:6,class:'tdot'},g);

  g.style.cursor='pointer';

 });
 allEdges().forEach(function(e){
  if(e.kind==='belongs')return;var a=P[e.src],b=P[e.dst];if(!a||!b)return;

 });
 W.nodes.forEach(function(n){

  el('circle',{r:stage?7.5:4.5,class:'core'},g);
  el('circle',{r:stage?22:14,class:'hit'},g);

   go.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){if(b.getAttribute('data-a')==='next')openCine(nx.id,0,false);else{seek(sceneStart(scenes.length-1)+.01);pause()}}})}},
 {name:'自测',dur:2,build:function(root,L){
   var qz=h('div','qz',null,root);h('div','sc-k','CHECK · 三道题全对即点亮',qz);var hd=h('div','sc-h','自测：点亮这颗星',qz);tw(L,hd,0,.6,'up');
   var qs=quizState[n.id]||(quizState[n.id]={});
   n.quiz.forEach(function(q,j){var box=h('div','q',null,qz);tw(L,box,.3+j*.35,.6,'up');h('div','qt',(j+1)+'. '+esc(q.q),box);var op=h('div','opts',null,box);var ex=h('div','ex','',box);
    q.options.forEach(function(o,k){var b=h('button','opt',esc(String.fromCharCode(65+k)+'. '+o),op);b.onclick=function(){qs[j]=k;op.querySelectorAll('.opt').forEach(function(x){x.classList.remove('ok','no')});b.classList.add(k===q.answer?'ok':'no');box.classList.add('done');ex.innerHTML=(k===q.answer?'✓ 对。':'✗ 再想想。')+esc(q.explain);logEv(n.id,'quiz',{q:j,choice:k,correct:k===q.answer});checkLit()}});
   });
   var res=h('div','qres','',qz);
   function checkLit(){var ok=n.quiz.every(function(q,j){return qs[j]===q.answer});if(ok){if(setLvl(n.id,'lit')){logEv(n.id,'lit',{via:'quiz'});burst()}res.innerHTML='<span class="litmsg">✨ 已点亮「'+esc(n.short)+'」</span>'+(nx?' <button class="btn pri" data-a="n">下一节点 →</button>':' <button class="btn pri" data-a="m">回到星图</button>');var b=res.querySelector('[data-a]');if(b)b.onclick=function(){if(nx)openCine(nx.id,0,false);else closeCine()};headState()}else{res.textContent=Object.keys(qs).length<3?'':'还有题没答对，改选即可。'}}
   if(LV.indexOf(lvl(n.id))>=3)res.innerHTML='<span class="litmsg">✨ 这颗星已点亮</span>';
 }}
 ];
}

function sceneStart(i){var s=0;for(var j=0;j<i;j++)s+=scenes[j].dur;return s}
function openCine(id,t0,startPaused){
 var n=N[id];if(!n||!n.quiz)return;closeTimeline();panel.classList.remove('on');pause();
 cur=n;scenes=sceneDefs(n);total=scenes.reduce(function(a,s){return a+s.dur},0);built={};curScene=-1;stage.innerHTML='';
 cineOn=true;$('cine').classList.add('on');document.body.classList.add('cine');
 $('crumb').innerHTML='学者 · 人类文明通史 · <b>'+n.no+' / '+STAGES.length+'　'+esc(n.icon+' '+n.name)+'</b>';
 if(lvl(id)==='unseen')setLvl(id,'seen');logEv(id,'open',{view:'cine'});headState();buildScrub();
 renderAt(t0||0);if(!startPaused)play();
 try{history.replaceState(null,'','#node='+id)}catch(e){}
}
function headState(){if(!cur)return;var st=stateOf(cur.id);var b=$('cstate');b.className='badge b-'+st;b.textContent=LVN[st]}
function closeCine(){pause();cineOn=false;$('cine').classList.remove('on');document.body.classList.remove('cine');stage.innerHTML='';refreshAll();updateCount();try{history.replaceState(null,'',location.pathname)}catch(e){}}
function buildScrub(){var sc=$('scrub');sc.querySelectorAll('.ch,.chl').forEach(function(e){e.remove()});scenes.forEach(function(s,i){var x=sceneStart(i)/total*100;var c=h('div','ch',null,sc);c.style.left=x+'%';var l=h('div','chl',esc(s.name),sc);l.style.left=x+'%';l.addEventListener('pointerdown',function(ev){ev.stopPropagation()});l.onclick=function(ev){ev.stopPropagation();seek(sceneStart(i)+.01)}})}
function renderAt(tt){
 t=clamp(tt,0,total);var i=0,acc=0;while(i<scenes.length-1&&t>=acc+scenes[i].dur){acc+=scenes[i].dur;i++}
 var u=t-acc,S=scenes[i];
 if(i!==curScene){if(curScene>=0&&built[curScene])built[curScene].root.classList.remove('on');
  if(!built[i]){var root=h('div','scene',null,stage);var L=[];root.classList.add('on');var fn=S.build(root,L);built[i]={root:root,L:L,fn:fn}}
  built[i].root.classList.add('on');curScene=i;
  $('scrub').querySelectorAll('.chl').forEach(function(e,j){e.classList.toggle('cur',j===i)})}
 var B=built[i];applyTw(B.L,u);if(B.fn)B.fn(u);
 var last=i===scenes.length-1;B.root.style.opacity=last?clamp(u/.4,0,1):clamp(Math.min(u/.4,(S.dur-u)/.45),0,1);
 var pct=t/total*100;$('scrub').querySelector('.fl').style.width=pct+'%';$('scrub').querySelector('.kn').style.left=pct+'%';
 $('ctime').textContent=fmt(t)+' / '+fmt(total);
 if(t>total*.5&&cur&&LV.indexOf(lvl(cur.id))<2){setLvl(cur.id,'learning');headState()}
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function seek(tt){renderAt(tt)}
function play(){if(!cur)return;if(t>=sceneStart(scenes.length-1))renderAt(0);playing=true;$('cPlay').textContent='⏸';lastTs=performance.now();logEv(cur.id,'play');requestAnimationFrame(tick)}
function pause(){playing=false;$('cPlay').textContent='▶'}
function tick(now){if(!playing||!cineOn)return;var dt=Math.min(.1,(now-lastTs)/1000);lastTs=now;var prev=t,nt=t+dt;
 var qs=sceneStart(scenes.length-1);if(prev<qs&&nt>=qs){renderAt(qs+.001);/* 暂停点：自测 */var q0=performance.now();(function fin(n2){if(!cineOn)return;var k=clamp((n2-q0)/1000,0,1.9);renderAt(qs+.001+k);if(k<1.9)requestAnimationFrame(fin)})(q0);pause();return}
 if(nt>=total){renderAt(total);pause();return}renderAt(nt);requestAnimationFrame(tick)}
$('cPlay').onclick=function(){playing?pause():play()};
$('cClose').onclick=closeCine;
$('cPrevN').onclick=function(){var i=STAGES.indexOf(cur);if(i>0)openCine(STAGES[i-1].id)};
$('cNextN').onclick=function(){var i=STAGES.indexOf(cur);if(i<STAGES.length-1)openCine(STAGES[i+1].id)};
(function(){var sc=$('scrub'),down=false;function at(e){var r=sc.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width,0,1)*total)}
 sc.addEventListener('pointerdown',function(e){down=true;try{sc.setPointerCapture(e.pointerId)}catch(x){}at(e)});sc.addEventListener('pointermove',function(e){if(down)at(e)});sc.addEventListener('pointerup',function(){down=false})})();
document.addEventListener('keydown',function(e){
 if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(cineOn){if(e.key===' '){e.preventDefault();playing?pause():play()}
  else if(e.key==='Escape')closeCine();
  else if(e.key==='ArrowRight'&&e.shiftKey)$('cNextN').click();
  else if(e.key==='ArrowLeft'&&e.shiftKey)$('cPrevN').click();
  else if(e.key==='ArrowRight'){var i=Math.min(scenes.length-1,curScene+1);seek(sceneStart(i)+.01)}
  else if(e.key==='ArrowLeft'){var j=t-sceneStart(curScene)>1.2?curScene:Math.max(0,curScene-1);seek(sceneStart(j)+.01)}}
 else if(tlOn&&e.key==='Escape')closeTimeline();
 else if(e.key==='Escape'){modal.classList.remove('on');panel.classList.remove('on')}
});
function burst(){var c=$('burst'),ctx=c.getContext('2d'),w=c.width,hh=c.height,ps=[],dp=devicePixelRatio;for(var i=0;i<160;i++){var a=Math.random()*6.283,v=(Math.random()*6+2)*dp;ps.push({x:w/2,y:hh*.45,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.5?'#67e8f9':'#fde68a'})}
 var t0=performance.now();(function f(now){ctx.clearRect(0,0,w,hh);var al=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;if(p.l>0){al=true;ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.4*dp,0,6.283);ctx.fill()}});
  var r=(now-t0)/4;ctx.globalAlpha=Math.max(0,1-r/400);ctx.strokeStyle='#fff';ctx.lineWidth=3*dp;ctx.beginPath();ctx.arc(w/2,hh*.45,r*dp,0,6.283);ctx.stroke();ctx.globalAlpha=1;if(al)requestAnimationFrame(f);else ctx.clearRect(0,0,w,hh)})(t0)}

/* ---- HUD wiring ---- */
function showCiv(ms){flyToIds(['t-civ'].concat(T['t-civ'].members),{pad:1.2,ms:ms});showTopic('t-civ')}
$('bTl').onclick=openTimeline;$('tlClose').onclick=closeTimeline;$('bNew').onclick=openNewTopic;$('bExp').onclick=exportJSON;$('bCiv').onclick=function(){showCiv(1100)};
$('bImp').onclick=function(){$('fImp').click()};$('fImp').onchange=function(){if(this.files[0])importJSON(this.files[0]);this.value=''};
$('bHome').onclick=function(){panel.classList.remove('on');home(900)};$('bLeg').onclick=function(){$('legend').classList.toggle('on')};
$('search').addEventListener('change',function(){var q=this.value.trim();if(!q)return;var x=W.nodes.find(function(n){return n.name===q})||W.nodes.find(function(n){return n.name.indexOf(q)>=0||(n.short||'').indexOf(q)>=0});
 if(x){var p=P[x.id];flyTo(p.x,p.y,1.7,1000);var g=nodeEls[x.id];g.classList.add('flash');setTimeout(function(){g.classList.remove('flash')},2600);return}
 var tp=allTopics().find(function(t){return t.name.indexOf(q)>=0});if(tp){flyToIds([tp.id].concat(tp.members),{pad:1.4});showTopic(tp.id)}else toast('没找到：'+q)});

/* ---- test hooks（无头截图用） ---- */
window.__seek=function(id,s){if(!cur||cur.id!==id)openCine(id,s,true);pause();renderAt(s)};
window.__openMap=function(){closeCine();closeTimeline()};
window.__openTimeline=function(){openTimeline()};
window.__state=function(){return U};

/* ---- boot ---- */
renderMap();
var f0=fitIds(W.domains.map(function(d){return d.id}),1.02);C.x=f0.x;C.y=f0.y;C.k=f0.k*.55;applyCam();
var hp={};location.hash.replace(/^#/,'').split('&').forEach(function(kv){var a=kv.split('=');if(a[0])hp[a[0]]=decodeURIComponent(a[1]||'')});
if(hp.demo){save=function(){};(hp.demo.split(',')).forEach(function(kv){var a=kv.split(':');if(N[a[0]])U.progress[a[0]]={state:a[1]||'lit',ts:'demo'}});refreshAll();updateCount()}
if(hp.node&&N[hp.node]&&N[hp.node].quiz){C.k=f0.k;applyCam();openCine(hp.node,parseFloat(hp.t||0),hp.t!=null)}
else if(hp.view==='timeline'){C.k=f0.k;applyCam();openTimeline()}
else if(hp.view==='civ'){C.k=f0.k;applyCam();showCiv(10)}
else home(1800);
})();
