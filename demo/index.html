<style>
:root{--bg:#04060f;--ink:#e6edf7;--mut:#8b9ab3;--line:rgba(148,163,184,.18);--amber:#fbbf24;--cyan:#67e8f9;--gold:#fde68a;--panel:rgba(10,16,32,.82);
font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

#sync{font-size:11.5px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}#sync.ok{color:#6ee7b7;border-color:#34d399}#sync.warn{color:var(--amber);border-color:var(--amber)}
.srcs{font-size:12px;color:var(--mut);margin-top:10px}.srcs a{color:var(--cyan)}.srcs li{cursor:default;border:0;padding:2px 0;display:block}

.btn.pri{background:linear-gradient(90deg,#0e7490,#6d28d9);border:0}

#legend{bottom:14px;left:16px;font-size:12px;color:var(--mut);background:var(--panel);padding:8px 12px;border-radius:12px;border:1px solid var(--line);display:none;max-width:560px}
#legend.on{display:flex}

.neb{cursor:pointer}
.lbl-dom{font-size:66px;font-weight:700;letter-spacing:.1em;fill:#fff;opacity:.92;pointer-events:none;paint-order:stroke;stroke:rgba(4,6,15,.6);stroke-width:6px;transition:opacity .4s}
.lbl-top{font-size:25px;fill:#dbeafe;cursor:pointer;paint-order:stroke;stroke:rgba(4,6,15,.85);stroke-width:5px;transition:opacity .4s}

.utop .lbl-top{fill:#f0abfc;font-style:italic}
svg.z-far .lbl-top,svg.z-far .lbl-node{opacity:0}
svg.z-mid .lbl-node:not(.lbl-stage){opacity:0}
svg.z-near .lbl-dom{opacity:.28}
svg.z-far .k-related,svg.z-far .k-causes,svg.z-far .k-contrast,svg.z-far .k-prereq{opacity:.1}
.tdot{fill:#93c5fd;opacity:.7}

.k-leads_to{stroke:#fbbf24;stroke-width:2.2;opacity:.85}.k-causes{stroke:#fb7185}.k-related{stroke:#67e8f9;opacity:.32}
.k-prereq{stroke:#a78bfa;stroke-dasharray:6 4}.k-contrast{stroke:#f472b6;stroke-dasharray:2 4}.k-parallel{stroke:#4ade80}
.umem{stroke:#f0abfc;stroke-dasharray:4 5;stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke;opacity:.7}
.nd{cursor:pointer;transition:opacity .25s}
.nd .core{fill:#94a3b8;opacity:.5;transition:all .5s}
.nd .halo{opacity:0;transform-box:fill-box;transform-origin:center}
.nd .ring{fill:none;stroke:var(--amber);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}

.st-seen .core{fill:#e2e8f0;opacity:.85}
.st-learning .core{fill:#fde68a;opacity:.9}.st-learning .ring{opacity:1;animation:pulse 1.8s ease-in-out infinite}
.st-lit .core{fill:#fff;opacity:1}.st-lit .halo{opacity:1;animation:breathe 3.2s ease-in-out infinite}
.st-mastered .core{fill:var(--gold);opacity:1}.st-mastered .halo{opacity:1;fill:url(#gGold);animation:breathe 3.2s ease-in-out infinite}

@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:.2}}

svg.focus .edge:not(.hi),svg.focus .cl{opacity:.05}

.edge.hi{opacity:1!important;stroke-width:2.6}
.nd.flash .core{animation:flash 1.2s ease-out 2}

.panel{position:fixed;z-index:6;right:16px;top:64px;width:340px;max-height:calc(100% - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(10px);display:none;font-size:13.5px;line-height:1.65}

#lhead{position:absolute;left:0;right:0;top:0;height:48px;padding:0 18px;z-index:4;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);gap:8px}
#lcrumb{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}#lcrumb b{color:var(--ink)}
#lbody{position:absolute;left:0;right:0;top:48px;bottom:78px;display:flex}
#lrail{width:236px;flex:0 0 236px;overflow-y:auto;padding:6px 8px 16px 14px;font-size:13px;border-right:1px solid var(--line)}
#lrail .rp{color:var(--mut);font-size:11.5px;letter-spacing:.12em;margin:12px 0 4px 4px}
#lrail .ri{padding:6px 8px;border-radius:9px;cursor:pointer;display:flex;gap:6px;align-items:baseline;line-height:1.4;border:1px solid transparent}
#lrail .ri:hover{background:rgba(103,232,249,.07)}
#lrail .ri.cur{background:rgba(103,232,249,.14);border-color:rgba(103,232,249,.45)}
#lrail .ri .mk{width:14px;flex:0 0 14px;color:#6ee7b7}#lrail .ri .mn{margin-left:auto;color:var(--mut);font-size:11.5px;white-space:nowrap}
#lrail .ri span.t{flex:1}
#lstage{flex:1;min-width:0;position:relative;overflow-y:auto;overflow-x:hidden;padding:2vh 4vw 4vh}
.lsc{max-width:1060px;margin:0 auto;min-height:100%}
.lsc.c{display:flex;flex-direction:column;justify-content:center}
.lsc .an{opacity:0;transform:translateY(24px);transition:opacity .6s ease-out,transform .6s ease-out}
.lsc .anf{opacity:0;transition:opacity .7s ease-out}
.lsc.in .an{opacity:1;transform:none}.lsc.in .anf{opacity:1}
.lsc .big{font-size:clamp(28px,5vw,64px);font-weight:800;letter-spacing:.05em;margin:0 0 2vh;line-height:1.2}
.lsc .lead{font-size:clamp(15px,1.9vw,24px);line-height:1.7;color:#cbd5e1;max-width:900px}
.lsc .mut{color:var(--mut);font-size:13px}
.lsc ul.pts{list-style:none;padding:0;margin:2vh 0}
.lsc ul.pts li{font-size:clamp(15px,1.9vw,25px);line-height:1.6;margin:1.8vh 0;padding-left:1em;border-left:3px solid rgba(103,232,249,.4)}
.lsc .tl{position:relative;margin:2vh 0;padding-left:22px;border-left:2px solid rgba(251,191,36,.45)}
.lsc .tl .it{margin:2.2vh 0;position:relative;font-size:clamp(14px,1.7vw,22px);line-height:1.6}
.lsc .tl .it:before{content:"";position:absolute;left:-29px;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.lsc .tl .wh{font-weight:700;color:var(--gold);margin-right:8px}
.lsc .quote{font-size:clamp(20px,3vw,40px);line-height:1.5;border-left:4px solid var(--amber);padding:1vh 0 1vh 1.4em;margin:3vh 0 1.4vh;font-style:italic}
.lsc .who{font-size:clamp(14px,1.5vw,19px);color:var(--gold);margin:0 0 1vh 1.4em}
.lsc .cmp{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw;margin:2vh 0}
.lsc .cmp>div{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:16px;padding:2vh 1.4vw;font-size:clamp(14px,1.5vw,19px);line-height:1.7}
.lsc .cmp h3{margin:0 0 1vh;font-size:clamp(17px,2vw,26px)}
.lsc svg{width:100%;height:auto;display:block}
.lsc .ml{display:flex;flex-direction:column;gap:6px;margin-top:1vh;font-size:clamp(13px,1.3vw,17px)}
.lsc sup.rf{color:var(--cyan);font-size:.65em;margin-left:2px}
.lsrc{margin-top:3vh;padding-top:1vh;border-top:1px dashed var(--line);font-size:12px;color:var(--mut);line-height:1.7}

.lab-d{background:rgba(251,146,60,.14);color:#fdba74;border:1px solid rgba(251,146,60,.45)}
.lab-a{background:rgba(148,163,184,.14);color:#cbd5e1;border:1px solid rgba(148,163,184,.4)}
.lab-p{background:rgba(192,132,252,.14);color:#d8b4fe;border:1px solid rgba(192,132,252,.4)}
.lsc .card{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:14px;padding:1.6vh 1.4vw;margin:1.4vh 0;line-height:1.7}
.lsc .card.ok{border-color:#34d399;background:rgba(52,211,153,.08)}.lsc .card.no{border-color:#fb7185;background:rgba(251,113,133,.08)}
.lsc .g-read{font-size:clamp(40px,8vw,96px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold);margin:2vh 0}
.lsc input[type=range]{width:100%;accent-color:#67e8f9}
.lsc .gbar{position:relative;height:46px;margin:34px 0 22px;border-radius:8px;background:rgba(148,163,184,.18)}
.lsc .gbar i{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;border-radius:2px}
.lsc .gbar i b{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;font-style:normal}
.lsc .gbar span{position:absolute;bottom:-20px;font-size:11px;color:var(--mut)}
.lsc .bk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lsc .bk .btn.sel{border-color:var(--cyan);background:rgba(103,232,249,.18)}
.lsc .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2vh}
.lsc textarea,.lsc input[type=text]{width:100%;background:#060b18;border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:none;font-size:15px}
.lsc textarea{min-height:140px;resize:vertical;line-height:1.7}
.lsc .btn:disabled{opacity:.4;cursor:not-allowed}
.lsc .doneBig{font-size:clamp(30px,5vw,60px);font-weight:800;color:var(--gold);text-shadow:0 0 22px rgba(251,191,36,.5)}
#lbar{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:5;background:linear-gradient(0deg,rgba(2,3,10,.96),rgba(2,3,10,.4));display:flex;align-items:center;gap:10px;padding:0 18px}

#lbar .cb.play{min-width:52px;height:52px;font-size:18px;background:linear-gradient(135deg,#0e7490,#6d28d9);border:0}
#lprog{flex:1;height:6px;border-radius:3px;background:rgba(148,163,184,.2);overflow:hidden}
#lprog .fl{height:100%;width:0;background:linear-gradient(90deg,#67e8f9,#a78bfa);transition:width .25s linear}
#ltime{font-size:12.5px;color:var(--mut);min-width:120px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:700px){
 #lbody{flex-direction:column}

}

 办法等规则体系。","core":"欧盟《人工智能法》、中国生成式 AI 办法等规则体系。","source":"atlas"},{"id":"s1","kind":"node","node_type":"era","name":"人属、语言与认知革命","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"人从会用石器的灵长类，变成能用语言共享想象、并把技能代代累积的物种。","core":"人从会用石器的灵长类，变成能用语言共享想象、并把技能代代累积的物种。","icon":"🔥","ya":[2800000,50000],"mark":300000,"no":1,"short":"认知革命","dates":"≈280万年前（人属）→ ≈30万年前（智人）→ ≈7–5万年前（走出非洲主扩散）","mech":[{"k":"能量","v":"用火与熟食（经常性用火的证据 ⚠ 有争议，较确定的在数十万年前）；狩猎采集。"},{"k":"信息","v":"语言（起源时间 ⚠ 无定论）+ 符号（装饰品、颜料、岩画）→ 文化可以累积，不必每代重新发明。"},{"k":"组织","v":"以亲缘为主的小群体，靠互惠、远距交换网络连接更大的人群。"}],"abc":{"A":"符号与艺术出现：装饰品、颜料、洞穴/岩画（如法国肖维洞穴约 3.7–3.35 万年前）。","B":"没有国家与成文规则，秩序靠亲缘、习俗与声誉；信仰形态只能从葬俗等间接推测。","C":"石器技术、用火、狩猎采集；人类扩散到除南极外的各大洲。"},"east":"周口店北京猿人属直立人（年代为数十万年前，⚠ 测年有分歧）；北京田园洞人约 4 万年前，是东亚较早的现代人化石之一。基因证据支持现代人主要源自非洲，并与尼安德特人、丹尼索瓦人有少量混血；「多地区起源」在中国学界仍有讨论。","west":"非洲是智人起源地（摩洛哥 Jebel Irhoud 化石约 30 万年前）；欧洲约 4.5–4 万年前现代人进入，此后尼安德特人消失。","facts":["人属出现 ≈280–250 万年前（埃塞俄比亚 Ledi-Geraru 下颌骨约 280 万年前）","最早的智人化石 ≈30 万年前","全新世开始于约 11,700 年前（气候转暖且稳定）"],"interp":[{"who":"赫拉利《人类简史》","text":"「认知革命」：约 7 万年前语言能力突变，让人能相信共同的「虚构故事」，从而大规模协作——科普叙事。"},{"who":"McBrearty & Brooks（2000）","text":"反方：现代行为在非洲是数十万年里逐步出现的，不是一次「革命」。"},{"who":"Wrangham「烹饪假说」","text":"熟食释放能量、支撑大脑变大——有争议的进化解释。"}],"next":"遍布全球的狩猎采集者 + 全新世的稳定气候，让「把植物和动物留在身边」第一次变得划算。","lenses":["A","C"],"drivers":{"能量":"火与肌肉","信息载体":"语言与符号","协作规模":"亲缘小群体","观念":"万物有灵（推测）"},"quiz":[{"q":"目前已知最早的智人化石大约距今多久？","options":["约 3 万年","约 30 万年","约 280 万年","约 1.2 万年"],"answer":1,"explain":"摩洛哥 Jebel Irhoud 化石约 30 万年前；280 万年前是人属出现。"},{"q":"「约 7 万年前语言能力突变，引发认知革命」属于哪一类说法？","options":["考古事实","学界共识","科普叙事 / 解释框架","官方定论"],"answer":2,"explain":"这是赫拉利的科普叙事；McBrearty & Brooks 认为现代行为是逐步出现的。"},{"q":"哪个条件让「把植物和动物留在身边」第一次变得划算？","options":["铁器","全新世稳定气候","文字","铸币"],"answer":1,"explain":"全新世约 11,700 年前开始，气候转暖且稳定。"}],"sources":[{"title":"Villmoare et al. 2015, Early Homo at 2.8 Ma from Ledi-Geraru, Science","url":"https://www.science.org/doi/10.1126/science.aaa1343"},{"title":"Richter et al. 2017, The age of the hominin fossils from Jebel Irhoud, Nature","url":"https://www.nature.com/articles/nature22335","note":"315±34 千年"},{"title":"Quiles et al. 2016, Chauvet-Pont d’Arc chronological model, PNAS","url":"https://www.pnas.org/doi/10.1073/pnas.1523158113","note":"两期：3.7–3.35 万年前、3.1–2.8 万年前"},{"title":"Fu et al. 2013, DNA analysis of an early modern human from Tianyuan Cave, PNAS","url":"https://www.pnas.org/doi/10.1073/pnas.1221359110"}],"source":"atlas"},{"id":"s2","kind":"node","node_type":"era","name":"农业革命（新石器革命）","domain":"d-hist","home_topic":"t-civ","topics":["t-civ","u-t-energy-history"],"status":"ready","summary":"从「找食物」变成「生产食物」：人定居下来，同一块地能养活多得多的人。","core":"从「找食物」变成「生产食物」：人定居下来，同一块地能养活多得多的人。","icon":"🌾","ya":[12000,5000],"mark":11000,"no":2,"short":"农业革命","dates":"≈1.2万–0.5万年前，多个中心各自独立发生","mech":[{"k":"能量","v":"驯化作物把单位土地截获的太阳能大幅转成人可吃的热量；牲畜提供肌肉力与奶肉。"},{"k":"信息","v":"历法、物候与育种知识变成关键资产；陶器、符号开始出现。"},{"k":"组织","v":"定居、储藏 → 财产与继承 → 村落；不平等逐步扩大。"}],"abc":{"A":"陶器、祖先崇拜、纪念性建筑；贾湖骨笛约 9000 年前。","B":"财产、继承、等级出现；土耳其哥贝克力石阵（约 1.16 万年前起）早于成熟农业，引出「仪式/信仰先于农业？」的讨论（⚠）。","C":"驯化动植物、剩余、人口增长；人畜共患病增加；多地骨骼显示早期农人营养与健康一度变差。"},"east":"中国是独立起源中心之一：华北粟、黍（约 1 万–8000 年前），长江流域稻作的驯化是数千年的渐进过程（约 9000–6000 年前，⚠ 时间节点有争议）。","west":"新月沃地：小麦、大麦、豆类及羊、牛驯化约 1.15 万–1 万年前起；美洲（玉米、马铃薯）、新几内亚等地也独立发生。","facts":["农业起源是多中心、渐进的，不是一次事件","新月沃地是已知最早的中心之一","中国北方粟作、南方稻作是两个独立传统"],"interp":[{"who":"戴蒙德《枪炮、病菌与钢铁》","text":"欧亚大陆东西轴向、可驯化物种多，所以农业与技术更易传播——地理解释，被批评为过度决定论。"},{"who":"赫拉利","text":"「史上最大的骗局」：个体生活变差、物种数量变多——修辞化的解释。"},{"who":"詹姆斯·斯科特《反谷》","text":"谷物易计量、易征税，所以和早期国家绑在一起——政治人类学解释。"}],"next":"稳定的剩余能养活不种地的人（祭司、工匠、武士、管理者），城市与国家的底座有了。","lenses":["C","B"],"drivers":{"能量":"驯化太阳能（作物、牲畜）","信息载体":"历法、陶器符号","协作规模":"村落","观念":"祖先、丰产"},"quiz":[{"q":"关于农业起源，哪项是本页列出的事实？","options":["只在新月沃地发生一次","多中心、渐进发生","先有文字后有农业","由一位发明家完成"],"answer":1,"explain":"农业起源是多中心、渐进的，不是一次事件。"},{"q":"中国北方与南方的早期农业传统分别是？","options":["小麦 / 玉米","粟黍 / 稻作","稻作 / 粟黍","大麦 / 马铃薯"],"answer":1,"explain":"华北粟、黍，长江流域稻作，是两个独立传统。"},{"q":"「农业是史上最大的骗局」是谁的说法、性质如何？","options":["戴蒙德，考古事实","赫拉利，修辞化的解释","斯科特，学界共识","柴尔德，测年数据"],"answer":1,"explain":"赫拉利的修辞化解释，不是事实陈述。"}],"sources":[{"title":"UNESCO 世界遗产：Göbekli Tepe（前 9600–前 8200）","url":"https://whc.unesco.org/en/list/1572/"},{"title":"Zhang et al. 1999, Oldest playable musical instruments found at Jiahu, Nature","url":"https://doi.org/10.1038/43865"},{"title":"Richerson, Boyd & Bettinger 2001, Was Agriculture Impossible during the Pleistocene but Mandatory during the Holocene?, American Antiquity","url":"https://doi.org/10.2307/2694241"}],"source":"atlas"},{"id":"s3","kind":"node","node_type":"era","name":"城市、国家与文字","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"人类第一次学会管理成千上万的陌生人：靠城市、王权、官僚，以及把信息写下来。","core":"人类第一次学会管理成千上万的陌生人：靠城市、王权、官僚，以及把信息写下来。","icon":"📜","ya":[6000,3000],"mark":5200,"no":3,"short":"城市·国家·文字","dates":"≈前4000–前1000（各地先后）","mech":[{"k":"能量","v":"灌溉农业剩余；青铜冶炼；轮子（约前 3500 年）、犁与畜力。"},{"k":"信息","v":"文字：两河早期楔形文字泥板大多是行政记账；文字让税收、法律、历法可以跨越时间与距离。"},{"k":"组织","v":"王权 + 神庙 + 书吏官僚 + 常备武力；「国家」作为专业化的强制与再分配机器出现。"}],"abc":{"A":"史诗（《吉尔伽美什》）、历法、文学与纪念性艺术；文字让叙事能被固定下来。","B":"神王或王权神授、神庙经济、成文法（《汉穆拉比法典》约前 1754 年）；西周的「天命」观念。","C":"青铜器、轮子、灌溉网络、手工业专业化、长距离贸易。"},"east":"良渚（约前 3300–前 2300）有大型水利和城址，被许多学者视为早期国家（⚠ 有争议）；二里头（约前 1750–前 1530）与「夏」是否对应仍有争议；殷墟甲骨文（约前 1250–前 1050）是目前公认最早的成体系汉字，内容以王室占卜为主；周约前 1046 年代商（⚠ 断代工程的推定年）。","west":"苏美尔乌鲁克（约前 4000–前 3100）；楔形文字与埃及圣书字约前 3200 年；埃及统一约前 3100 年；印度河文明（约前 2600–前 1900 成熟期，文字未破译）；腓尼基字母约前 1050 年，后来演变出希腊、拉丁字母。","facts":["两河最早的原始楔形文字泥板以行政、经济记录为主","甲骨文是商代晚期王室的占卜记录","东地中海青铜时代晚期体系约前 1200–前 1150 年崩溃"],"interp":[{"who":"对照观察","text":"西方早期文字以记账为主，中国现存最早的文字以占卜为主——但竹木简易腐，⚠ 可能有材料保存造成的幸存者偏差。"},{"who":"柴尔德「城市革命」（1950）","text":"城市、剩余集中、纪念性建筑、文字等 10 条考古判据作为一揽子特征出现——经典框架，细节各地差异很大；斯科特《反谷》等则质疑「文明即进步」的叙事。"}],"next":"书写阶层与跨国竞争积累到一定程度后，有人开始反思「人该怎么活、什么是对的」，这就是轴心时代。","lenses":["A","B","C"],"drivers":{"能量":"灌溉剩余 + 青铜","信息载体":"文字（记账、占卜）","协作规模":"城邦、早期国家","观念":"神王、天命"},"quiz":[{"q":"两河流域最早的原始楔形文字泥板，内容以什么为主？","options":["史诗","王室占卜","行政与经济记录","宗教经典"],"answer":2,"explain":"以行政、经济记录为主；甲骨文才以占卜为主。"},{"q":"《汉穆拉比法典》大约在什么时候？","options":["约前 3200 年","约前 1754 年","约前 508 年","约公元 313 年"],"answer":1,"explain":"约前 1754 年。"},{"q":"目前公认最早的成体系汉字是？","options":["良渚刻符","二里头陶文","殷墟甲骨文","秦小篆"],"answer":2,"explain":"殷墟甲骨文，约前 1250–前 1050。"}],"sources":[{"title":"UNESCO 世界遗产：良渚古城遗址（约前 3300–前 2300）","url":"https://whc.unesco.org/en/list/1592/"},{"title":"河南省文物局：科技考古揭示二里头遗址（测年约前 1750–前 1530）","url":"https://wwj.henan.gov.cn/2023/04-09/2721663.html"},{"title":"Childe 1950, The Urban Revolution, Town Planning Review 21(1)","url":"https://doi.org/10.3828/tpr.21.1.k853061t614q42qh"},{"title":"Britannica: urban revolution","url":"https://www.britannica.com/topic/urban-revolution"}],"source":"atlas"},{"id":"s4","kind":"node","node_type":"era","name":"轴心时代：思想的突破","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"几个文明几乎同时出现超越王权与部落的普遍伦理、哲学和反思传统。","core":"几个文明几乎同时出现超越王权与部落的普遍伦理、哲学和反思传统。","icon":"💭","ya":[2826,2226],"mark":2526,"no":4,"short":"轴心时代","dates":"≈前800–前200（雅斯贝尔斯的划分）","mech":[{"k":"能量","v":"铁器推广，农业和战争的规模扩大。"},{"k":"信息","v":"书写与经典文本扩散；铸币（吕底亚约前 7 世纪末–前 6 世纪；中国春秋布币）促进市场与流动。"},{"k":"组织","v":"诸国林立、竞争激烈：游士、城邦公民、僧团等不依附单一宫廷的知识人出现。"}],"abc":{"A":"哲学与批判性反思：儒、道、墨、法；佛教与耆那教；希腊哲学；希伯来先知传统。","B":"出现了高于君主的道德标准（天道、法、上帝、达摩），后来成为评判统治是否正当的依据。","C":"铁器、铸币、城市市场；中国很早掌握生铁铸造（约前 6–前 5 世纪起）。"},"east":"春秋战国（前 770–前 221）百家争鸣；孔子（前 551–前 479）；老子年代 ⚠ 有争议；印度：佛陀约公元前 5 世纪（⚠ 传统说法与学界推定相差近百年）。","west":"希腊城邦与雅典民主（克里斯提尼改革约前 508/507）；苏格拉底（前 469–前 399）、柏拉图、亚里士多德（前 384–前 322）；犹太人「巴比伦之囚」（前 586–前 539）之后，经典逐渐成形。","facts":["孔子、佛陀（约）、苏格拉底大致处在同一个公元前千年的中段","「轴心时代」一词来自雅斯贝尔斯《历史的起源与目标》（1949）"],"interp":[{"who":"雅斯贝尔斯","text":"轴心时代是人类精神的共同突破——解释框架，被批评过于整齐、以欧洲为中心。"},{"who":"Baumard 等（2015）「富足假说」","text":"生活水平跨过某个门槛之后，人开始重视长期与节制——有争议的量化解释。"}],"next":"这些思想随后被帝国吸收为治理意识形态或国教（儒学、佛教、基督教），从思想变成了秩序。","lenses":["A","B"],"drivers":{"能量":"铁器扩散","信息载体":"经典文本","协作规模":"诸国竞争","观念":"超越性伦理"},"quiz":[{"q":"「轴心时代」这个词出自谁？","options":["黑格尔","雅斯贝尔斯","汤因比","韦伯"],"answer":1,"explain":"雅斯贝尔斯《历史的起源与目标》（1949）。"},{"q":"孔子的生卒年是？","options":["前 551–前 479","前 469–前 399","前 384–前 322","前 770–前 221"],"answer":0,"explain":"前 469–前 399 是苏格拉底，前 384–前 322 是亚里士多德。"},{"q":"「轴心时代是人类精神的共同突破」应当怎样标注？","options":["事实","解释框架，被批评过于整齐","测年数据","已被证伪"],"answer":1,"explain":"它是解释框架，被批评过于整齐、以欧洲为中心。"}],"sources":[{"title":"Jaspers 1949, Vom Ursprung und Ziel der Geschichte（《历史的起源与目标》）"},{"title":"Baumard et al. 2015, Increased affluence explains the emergence of ascetic wisdoms and moralizing religions, Current Biology","url":"https://doi.org/10.1016/j.cub.2014.10.063"}],"source":"atlas"},{"id":"s5","kind":"node","node_type":"era","name":"帝国与丝路网络","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"大帝国学会用官僚、法律、道路、文字和共同信仰，长期统治数千万陌生人；横贯欧亚的交换网络连通。","core":"大帝国学会用官僚、法律、道路、文字和共同信仰，长期统治数千万陌生人；横贯欧亚的交换网络连通。","icon":"🏛️","ya":[2576,1426],"mark":2247,"no":5,"short":"帝国·丝路","dates":"≈前550–公元600","mech":[{"k":"能量","v":"农业税赋 + 灌溉、运河；铁农具普及。"},{"k":"信息","v":"统一文字和度量、法典、驿传、户籍。"},{"k":"组织","v":"郡县与行省、常备军、职业官僚；帝国采纳普世宗教或学说作为凝聚力。"}],"abc":{"A":"古典经典定型（儒家经学、希腊化文化、拉丁文学）；佛教艺术沿丝路东传。","B":"秦郡县制、汉代儒学官方化；罗马法与公民权；阿育王推广佛教；基督教 313 年获合法地位，380 年成为罗马国教。","C":"道路与运河网、货币经济、丝路贸易；传染病也沿着网络传播（安东尼瘟疫 165–180 年、查士丁尼瘟疫 541 年起）。"},"east":"秦统一（前 221）：书同文、车同轨、郡县制；汉（前 202–公元 220）；张骞约前 138 年起出使西域；佛教约公元 1 世纪传入；隋（581 年建立，589 年统一）重新统一中国。","west":"波斯阿契美尼德（约前 550–前 330）；亚历山大（死于前 323）；印度孔雀王朝（约前 322–前 185）；罗马帝国（前 27 年起），西罗马 476 年终结，东罗马延续至 1453 年。","facts":["「丝绸之路」一词是李希霍芬 1877 年才提出的","西罗马分裂后再也没有重新统一；中国在长期分裂后，于 589 年重新统一"],"interp":[{"who":"库马尔《千年帝国史》（Visions of Empire，2017）","text":"帝国是一套「统治多样性」的工具箱，跟民族国家的逻辑不同——比较史框架。"},{"who":"沙伊德尔《逃离罗马》","text":"欧洲长期碎片化、彼此竞争，是它后来崛起的前提——解释，争议大。"}],"next":"西方走向碎片化，教会成为跨国机构；东方维持统一的官僚帝国；伊斯兰世界在两者之间崛起。三条路径分开了。","lenses":["B","C","A"],"drivers":{"能量":"帝国税赋 + 运河","信息载体":"统一文字、法典、驿传","协作规模":"大帝国","观念":"普世宗教 / 国家学说"},"quiz":[{"q":"「丝绸之路」一词何时由谁提出？","options":["张骞，前 138 年","李希霍芬，1877 年","马可·波罗，13 世纪","司马迁，汉代"],"answer":1,"explain":"李希霍芬 1877 年才提出这个词。"},{"q":"基督教何时成为罗马国教？","options":["313 年","380 年","476 年","1453 年"],"answer":1,"explain":"313 年获合法地位，380 年成为国教。"},{"q":"中国在长期分裂后于哪一年重新统一？","options":["前 221 年","220 年","589 年","960 年"],"answer":2,"explain":"隋 581 年建立，589 年统一。"}],"sources":[{"title":"Princeton UP: Kumar, Visions of Empire (2017)","url":"https://press.princeton.edu/books/ebook/9781400884919/visions-of-empire"},{"title":"豆瓣：《千年帝国史》中信出版 2019","url":"https://book.douban.com/subject/33436176/"}],"source":"atlas"},{"id":"s6","kind":"node","node_type":"era","name":"中世纪、伊斯兰世界与宋代商业革命","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"世界宗教塑造了各大文明的秩序；同期宋代中国出现了前所未有的商业化、货币化和印刷文化。","core":"世界宗教塑造了各大文明的秩序；同期宋代中国出现了前所未有的商业化、货币化和印刷文化。","icon":"🪙","ya":[1426,576],"mark":1026,"no":6,"short":"中世纪·宋","dates":"≈600–1450","mech":[{"k":"能量","v":"水磨、马具与三圃制（欧洲）；宋代引入占城稻（1012 年），冶铁业大量用煤（⚠ 具体规模的估计有争议）。"},{"k":"信息","v":"造纸术 8 世纪传入伊斯兰世界；雕版印刷盛于唐宋；毕昇活字约 1040 年代（见沈括《梦溪笔谈》）。"},{"k":"组织","v":"欧洲：教会与王权双重权威、大学、行会、城市自治；中国：科举官僚加士大夫；伊斯兰：商法与跨区域商网。"}],"abc":{"A":"经院哲学、伊斯兰世界的翻译运动（8–10 世纪）、宋明理学（朱熹 1130–1200）。","B":"伊斯兰教兴起（622 年迁徙）；1054 年东西教会分裂；叙任权之争（1075–1122）；《大宪章》1215 年；科举制自隋唐起逐步成形。","C":"宋代商业革命：官交子（1023 年设益州交子务，1024 年首发）、市镇、海外贸易；欧洲：农业扩张、商业复兴、香槟集市。"},"east":"唐（618–907）、宋（960–1279）：火药配方见于《武经总要》（1044），指南针用于航海见于《萍洲可谈》（12 世纪初）；蒙古帝国（1206 年起）与元（1271–1368）打通欧亚。","west":"查理曼加冕（800）；封建制（这个概念本身被史学界反复检讨）；大学（博洛尼亚，传统定为 1088 年）；黑死病（1347–1351）造成欧洲大量人口死亡：常见估计约三分之一，高估计达 50%–60%，地区差异很大（⚠ 估计区间）。","facts":["交子是世界上最早由政府发行的纸币之一","黑死病沿着蒙古时代的欧亚网络传播"],"interp":[{"who":"内藤湖南「唐宋变革论」","text":"宋代是中国「近世」的开端——日本京都学派的解释，影响很大，也有人质疑。"},{"who":"李筠《中世纪：权力、信仰和现代世界的孕育》（2023）","text":"教会与王权的长期张力孕育了法治、代议和个人权利——制度史解释。"}],"next":"蒙古网络把火药、罗盘和瘟疫带向西方；葡萄牙 15 世纪初就开始沿非洲西岸南下，伊比利亚人带着新式帆船寻找通往亚洲的海路（1453 年君士坦丁堡陷落常被说成「逼出」大航海，⚠ 这是简化说法）。","lenses":["B","C","A"],"drivers":{"能量":"水磨、占城稻、煤（宋）","信息载体":"纸、雕版、活字","协作规模":"教会 / 科举官僚 / 商网","观念":"宗教秩序、理学"},"quiz":[{"q":"交子是什么？","options":["宋代官方发行的纸币之一","唐代铜钱","蒙古驿站","欧洲汇票"],"answer":0,"explain":"交子是世界上最早由政府发行的纸币之一（1023 年设益州交子务，1024 年首发官交子）。"},{"q":"黑死病大约造成欧洲多少人口死亡（估计区间）？","options":["约 5%","约三分之一或更多（估计区间）","约 90%","几乎没有影响"],"answer":1,"explain":"1347–1351，常见估计约三分之一，高估计达 50%–60%，地区差异很大。"},{"q":"内藤湖南「唐宋变革论」的性质是？","options":["史料原文","日本京都学派的解释","考古发现","法律条文"],"answer":1,"explain":"影响很大的解释，也有人质疑。"}],"sources":[{"title":"全国哲学社会科学工作办公室：何平，成都「交子」与官方交子","url":"http://www.nopss.gov.cn/n1/2023/0911/c219544-40075019.html"},{"title":"Britannica: Black Death（死亡率地区差异 1/8–2/3，约三分之一）","url":"https://www.britannica.com/event/Black-Death"},{"title":"维基百科：占城稻（大中祥符五年 1012 年遣使取种）","url":"https://zh.wikipedia.org/wiki/%E5%8D%A0%E5%9F%8E%E7%A8%BB"},{"title":"读书网：李筠《中世纪：权力、信仰和现代世界的孕育》岳麓书社 2023","url":"https://www.dushu.com/book/13990978/"}],"source":"atlas"},{"id":"s7","kind":"node","node_type":"era","name":"大航海与第一次全球化","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"海路第一次把各大洲连成一个交换网络，白银、作物、病菌和人口开始在全球流动。","core":"海路第一次把各大洲连成一个交换网络，白银、作物、病菌和人口开始在全球流动。","icon":"⛵","ya":[626,376],"mark":534,"no":7,"short":"大航海","dates":"≈1400–1650","mech":[{"k":"能量","v":"风帆与远洋船，火药武器。"},{"k":"信息","v":"古登堡印刷（约 1450 年代）带来书籍和地图的爆发；航海术与制图术进步。"},{"k":"组织","v":"国家特许的冒险事业、股份公司（荷兰东印度公司 1602 年成立）、殖民地体系。"}],"abc":{"A":"文艺复兴（14–16 世纪意大利起）；印刷使知识大量扩散；「新世界」冲击了欧洲旧有的世界观。","B":"宗教改革（1517 年路德）→「教随国定」（1555 年奥格斯堡和约）→ 1648 年威斯特伐利亚和约；殖民帝国建立。","C":"哥伦布交换（克罗斯比 1972 年提出的概念）：美洲作物传到亚非欧，旧大陆病菌造成美洲原住民人口大规模崩溃（⚠ 规模估计差异很大）；跨大西洋奴隶贸易约 1250 万人被运上船（跨大西洋奴隶贸易数据库的估计）。"},"east":"郑和七下西洋（1405–1433）后，明朝转向收缩；一条鞭法（嘉靖起各地试行，1581 年张居正下令通行全国）以白银征税，美洲和日本白银大量流入中国；玉米、番薯在 16 世纪传入中国。","west":"1492 年哥伦布到达美洲；1498 年达伽马抵达印度；1519–1522 年麦哲伦–埃尔卡诺船队完成环球航行；1521 年特诺奇蒂特兰陷落；1571 年西班牙建马尼拉，大帆船贸易把美洲和亚洲接了起来。","facts":["大量美洲白银最终流入中国","郑和船队早于哥伦布，但没有后续扩张"],"interp":[{"who":"Flynn & Giráldez","text":"以 1571 年马尼拉建城为全球化「诞生」——解释性定年。"},{"who":"为何明停航而欧洲出海","text":"财政与边防优先 vs 欧洲多国竞争——多种解释并存。"}],"next":"新的数据、新的仪器、印刷网络和海外财富汇在一起，为科学革命提供了土壤。","lenses":["C","B","A"],"drivers":{"能量":"风帆跨洋","信息载体":"古登堡印刷、地图","协作规模":"特许公司、殖民帝国","观念":"人文主义、宗教改革"},"quiz":[{"q":"郑和下西洋与哥伦布到达美洲，哪个更早？","options":["哥伦布（1492）","郑和（1405–1433）","同一年","史料无法判断"],"answer":1,"explain":"郑和船队早于哥伦布，但没有后续扩张。"},{"q":"大量美洲白银最终主要流向哪里？","options":["西班牙","英国","中国","印度"],"answer":2,"explain":"一条鞭法以白银征税，美洲和日本白银大量流入中国。"},{"q":"「以 1571 年马尼拉建城为全球化诞生」属于？","options":["事实","解释性定年（Flynn & Giráldez）","法律文件","考古测年"],"answer":1,"explain":"解释性定年。"}],"sources":[{"title":"SlaveVoyages：跨大西洋奴隶贸易估计（约 1250 万人被运上船）","url":"https://www.slavevoyages.org/assessment/estimates"},{"title":"北京大学人文社会科学研究院：一条鞭法的推行","url":"http://www.ihss.pku.edu.cn/wyjz1/articles/1373713217829867520.html"},{"title":"Crosby 1972, The Columbian Exchange: Biological and Cultural Consequences of 1492"},{"title":"Flynn & Giráldez 1995, Born with a “Silver Spoon”: The Origin of World Trade in 1571, Journal of World History"}],"source":"atlas"},{"id":"s8","kind":"node","node_type":"era","name":"科学革命与启蒙","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"人类发明了一套能系统纠错的求知方法（实验、数学、公开发表），并开始用理性重新论证政治的正当性。","core":"人类发明了一套能系统纠错的求知方法（实验、数学、公开发表），并开始用理性重新论证政治的正当性。","icon":"🔭","ya":[483,226],"mark":339,"no":8,"short":"科学·启蒙","dates":"≈1543–1800","mech":[{"k":"能量","v":"这一阶段能源结构还没变；变的是关于自然的知识。"},{"k":"信息","v":"印刷、期刊、望远镜和显微镜、数学化 → 知识可以复制、检验、累积。"},{"k":"组织","v":"科学学会（英国皇家学会 1660 年）、「文人共和国」通信网、沙龙与咖啡馆形成的公共领域。"}],"abc":{"A":"哥白尼（1543）、伽利略、牛顿《原理》（1687）；《百科全书》（1751–1772）；「进步」成为主导叙事（它本身也是被建构的观念 ⚠）。","B":"洛克《政府论》（1689）、社会契约、权利、宪政；美国独立（1776）、法国大革命（1789）；斯密《国富论》（1776）。","C":"为工业革命准备了「有用知识」；农业改良运动。"},"east":"利玛窦 1601 年进入北京；徐光启与利玛窦合译《几何原本》前六卷（1607）；清代考据学兴起；《四库全书》编纂（1773–1782）。","west":"科学从个人好奇变成有制度保障的事业；启蒙在英国、法国、苏格兰、德意志各有不同的版本。","facts":["《原理》出版于 1687 年","《几何原本》前六卷中译本于 1607 年刊行"],"interp":[{"who":"李约瑟问题","text":"为何近代科学没有在中国产生？——问题本身的预设也受到批评。"},{"who":"彭慕兰《大分流》（2000）","text":"约 1800 年前江南与英格兰发展水平相当，是煤和殖民地造成了分流——加州学派的解释，有对立观点。"},{"who":"Mokyr「工业启蒙」","text":"把知识当作可以公开交流的公共品，这一观念推动了工业革命——解释。"}],"next":"有用知识遇上廉价煤炭，加上革命塑造的「人民」，就是工业革命和民族国家。","lenses":["A","B"],"drivers":{"能量":"（能源未变，知识变）","信息载体":"期刊、仪器、数学","协作规模":"学会、文人共和国","观念":"自然法则、权利、进步"},"quiz":[{"q":"牛顿《原理》出版于哪一年？","options":["1543","1607","1687","1776"],"answer":2,"explain":"1687 年；1543 是哥白尼，1607 是《几何原本》中译。"},{"q":"徐光启与利玛窦合译《几何原本》前六卷刊行于？","options":["1601","1607","1660","1773"],"answer":1,"explain":"1607 年。"},{"q":"彭慕兰《大分流》的观点应当标作？","options":["事实","加州学派的解释，有对立观点","官方统计","已成定论"],"answer":1,"explain":"约 1800 年前江南与英格兰相当、煤和殖民地造成分流——一种解释。"}],"sources":[{"title":"Britannica: Principia（1687）","url":"https://www.britannica.com/topic/Principia"},{"title":"Mokyr 2009, The Enlightened Economy"},{"title":"Pomeranz 2000, The Great Divergence"}],"source":"atlas"},{"id":"s9","kind":"node","node_type":"era","name":"工业革命与民族国家","domain":"d-hist","home_topic":"t-civ","topics":["t-civ","u-t-energy-history"],"status":"ready","summary":"化石能源让人类第一次挣脱了「有机经济」的能量天花板；民族国家成为组织大众的默认方式。","core":"化石能源让人类第一次挣脱了「有机经济」的能量天花板；民族国家成为组织大众的默认方式。","icon":"⚙️","ya":[266,112],"mark":257,"no":9,"short":"工业·民族国家","dates":"≈1760–1914（英国 ≈1760–1840 为第一阶段）","mech":[{"k":"能量","v":"煤与蒸汽机（瓦特分离式冷凝器专利 1769 年）：从依赖每年的光合作用，转向开采亿万年储存下来的太阳能。"},{"k":"信息","v":"电报（1840 年代）、大众报刊、义务教育和识字率提升。"},{"k":"组织","v":"工厂制与工资劳动、股份公司、铁路网（1830 年利物浦–曼彻斯特铁路）；征兵制和国民教育塑造了「国民」。"}],"abc":{"A":"浪漫主义、民族主义、大众印刷文化；「时间纪律」进入日常生活。","B":"民族国家（意大利 1861 年、德国 1871 年统一）、公民权、代议制；同时期殖民帝国达到顶峰。","C":"纺织机械化、蒸汽、铁路、城市化；人均收入开始持续增长（⚠ 起点与速度有学术争议）。"},"east":"鸦片战争（1840–1842）；太平天国（1850–1864）；洋务运动（约 1861–1895）；日本明治维新（1868）；甲午战争（1894–1895）；1905 年废科举；1911 年辛亥革命，1912 年中华民国成立。","west":"英国率先工业化，比利时、德国、美国随后跟进；1848 年欧洲革命；马克思《资本论》第一卷 1867 年出版。","facts":["英国是第一个工业化国家","中国 1905 年废除科举"],"interp":[{"who":"Robert Allen","text":"英国工资高、煤便宜，用机器替代人工最划算——经济史解释。"},{"who":"Wrigley「有机经济」","text":"工业化之前的增长受土地光合作用的上限约束——框架。"},{"who":"安德森《想象的共同体》/ 盖尔纳","text":"民族是印刷资本主义和工业社会的产物——解释。"}],"next":"科学开始直接驱动产业（化学、电力），列强在全球竞争，最后撞上了总体战。","lenses":["C","B","A"],"drivers":{"能量":"煤与蒸汽：化石能源","信息载体":"电报、报刊、义务教育","协作规模":"工厂、民族国家","观念":"民族、阶级、进化"},"quiz":[{"q":"工业革命在能量上的本质变化是？","options":["更多使用风力","从每年的光合作用转向开采储存的化石能源","发明电网","大规模使用核能"],"answer":1,"explain":"从依赖每年的光合作用，转向开采亿万年储存下来的太阳能。"},{"q":"中国在哪一年废除科举？","options":["1840","1868","1905","1912"],"answer":2,"explain":"1905 年。"},{"q":"「民族是印刷资本主义和工业社会的产物」出自谁、什么性质？","options":["马克思，事实","安德森 / 盖尔纳，解释","斯密，统计","瓦特，专利"],"answer":1,"explain":"《想象的共同体》/ 盖尔纳的解释。"}],"sources":[{"title":"Wrigley 2010, Energy and the English Industrial Revolution, Cambridge UP","url":"https://doi.org/10.1017/CBO9780511779619"},{"title":"Allen 2009, The British Industrial Revolution in Global Perspective"}],"source":"atlas"},{"id":"s10","kind":"node","node_type":"era","name":"电气化、世界大战与信息革命","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"电力、石油和大公司把生产推到全球规模；两次世界大战重塑了国际秩序；计算机和互联网把信息变成主要的生产资料。","core":"电力、石油和大公司把生产推到全球规模；两次世界大战重塑了国际秩序；计算机和互联网把信息变成主要的生产资料。","icon":"⚡","ya":[156,16],"mark":79,"no":10,"short":"电气·大战·信息","dates":"≈1870–2010","mech":[{"k":"能量","v":"石油与电网（爱迪生珍珠街电站 1882 年）；哈伯–博施合成氨（1913 年工业化）支撑了人口增长。"},{"k":"信息","v":"电话、广播、电视 → 晶体管（1947）→ 集成电路（1958–1959）→ ARPANET（1969）→ 万维网（1989 年提出）→ iPhone（2007）让触屏智能手机普及（首款智能手机 IBM Simon 1994 年上市）。"},{"k":"组织","v":"福特流水线（1913）、跨国公司、总体战动员、福利国家；联合国（1945）、布雷顿森林体系（1944）。"}],"abc":{"A":"大众传媒、现代主义、消费文化；全球同步观看同一个画面。","B":"意识形态竞争（自由主义、共产主义、法西斯主义）；一战（1914–1918）、二战（1939–1945）；1945 年后去殖民化；冷战（约 1947–1991）。","C":"电气化、化工、汽车、绿色革命、计算机；1950 年后人口与能源消耗急剧加速。"},"east":"1919 年五四运动；1949 年中华人民共和国成立；1978 年改革开放；2001 年加入世贸组织，中国成为「世界工厂」。","west":"美国在第二次工业革命中领先；战后西欧一体化；硅谷与个人电脑、互联网。","facts":["晶体管 1947 年在贝尔实验室发明","第二次世界大战 1939–1945"],"interp":[{"who":"Robert Gordon","text":"1870–1970 年的「一次大浪潮」比信息革命更深刻——有争议的经济史判断。"},{"who":"霍布斯鲍姆「短 20 世纪」","text":"1914–1991 构成一个整体——史学分期解释。"}],"next":"万物数字化留下了海量数据，加上算力增长，机器开始做「认知工作」。","lenses":["C","B","A"],"drivers":{"能量":"石油与电网","信息载体":"广播 → 计算机 → 互联网","协作规模":"跨国公司、联合国","观念":"意识形态之争"},"quiz":[{"q":"晶体管发明于哪一年、在哪里？","options":["1913，福特工厂","1947，贝尔实验室","1969，ARPANET","1989，CERN"],"answer":1,"explain":"1947 年在贝尔实验室。"},{"q":"哈伯–博施合成氨工业化的意义是？","options":["支撑人口增长的化肥","发明电报","推动大航海","建立联合国"],"answer":0,"explain":"1913 年工业化，支撑了人口增长。"},{"q":"Robert Gordon「1870–1970 的大浪潮比信息革命更深刻」是？","options":["事实","有争议的经济史判断","联合国决议","专利数据"],"answer":1,"explain":"有争议的判断。"}],"sources":[{"title":"Britannica: smartphone（首款为 IBM Simon）","url":"https://www.britannica.com/technology/smartphone"},{"title":"BBC 2014: World’s first “smartphone” celebrates 20 years","url":"https://www.bbc.com/news/technology-28802053"},{"title":"Erisman et al. 2008, How a century of ammonia synthesis changed the world, Nature Geoscience","url":"https://www.nature.com/articles/ngeo325"}],"source":"atlas"},{"id":"s11","kind":"node","node_type":"era","name":"AI 时代（进行中）","domain":"d-hist","home_topic":"t-civ","topics":["t-civ"],"status":"ready","summary":"继能量（体力）之后，认知劳动开始被机器大规模替代和放大；模型成了一种新的信息载体。","core":"继能量（体力）之后，认知劳动开始被机器大规模替代和放大；模型成了一种新的信息载体。","icon":"🤖","ya":[14,1],"mark":4,"no":11,"short":"AI 时代","dates":"≈2012 至今（是否算一个独立阶段 ⚠ 尚无定论）","mech":[{"k":"能量","v":"数据中心用电成为新的约束，算力本质上就是电力换智能。"},{"k":"信息","v":"从「存储和传输信息」走向「压缩和生成信息」：模型把文本、图像压进参数里。"},{"k":"组织","v":"人与 AI 智能体协作；组织的边界和分工开始被重写（⚠ 尚在早期）。"}],"abc":{"A":"作者身份、教育和学习方式受到冲击（「学者」本身就是一个例子）。","B":"AI 治理：欧盟《人工智能法》2024 年通过；中国《生成式人工智能服务管理暂行办法》2023 年施行。","C":"深度学习（2012 年 AlexNet）→ Transformer（2017）→ ChatGPT（2022 年 11 月）→ 大模型与智能体。"},"east":"中国大模型生态 2023 年起快速形成，开源模型影响力明显上升；算力、芯片和能源成为中美竞争焦点。","west":"美国前沿实验室和云厂商主导前沿模型；欧盟侧重规则与监管。","facts":["Transformer 论文《Attention Is All You Need》发表于 2017 年","ChatGPT 于 2022 年 11 月发布"],"interp":[{"who":"开放问题","text":"AI 是第 N 次产业革命，还是信息革命的加速？——开放问题，本页不下结论。"}],"next":"还没写完：能量（电力和算力）、信息（模型）、协作（人加智能体）、观念（什么是「懂」和「作者」）四条线同时在变。","lenses":["C","A","B"],"drivers":{"能量":"算力 = 电力换智能","信息载体":"模型：压缩并生成","协作规模":"人加智能体","观念":"「懂」与「作者」被重新定义"},"quiz":[{"q":"Transformer 论文发表于哪一年？","options":["2012","2017","2022","2024"],"answer":1,"explain":"2017 年；2012 是 AlexNet，2022 年 11 月是 ChatGPT。"},{"q":"本页把「算力」的能量本质描述为？","options":["电力换智能","免费的","煤换蒸汽","人力换粮食"],"answer":0,"explain":"数据中心用电成为新约束，算力本质上就是电力换智能。"},{"q":"「AI 是第 N 次产业革命还是信息革命的加速」本页怎么处理？","options":["已定论是新革命","已定论是加速","作为开放问题，不下结论","认为无关"],"answer": function lessonStatus(events, id) {
  var out = { status: "new", chaptersDone: [], interactionsDone: [] };
  var evs = events.filter(function(e){ return e.node === id; }).sort(function(a, b){ return Date.parse(a.ts) - Date.parse(b.ts); });
  var any = false, lit = false, done = false;
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    any = true;
    var p = e.payload || {};
    if (e.action === "play") {
      if (typeof p.chapter === "string" && p.progress === 1 && out.chaptersDone.indexOf(p.chapter) < 0) out.chaptersDone.push(p.chapter);
      if (typeof p.interaction === "string" && out.interactionsDone.indexOf(p.interaction) < 0) out.interactionsDone.push(p.interaction);
    } else if (e.action === "quiz") {
      var total = Number(p.total == null ? 0 : p.total), correct = Number(p.correct == null ? 0 : p.correct);
      if (total >= 3 && correct === total && !lit) { lit = true; out.litAt = e.ts; }
    } else if (e.action === "lit") {
      if (!lit) { lit = true; out.litAt = e.ts; }
    } else if (e.action === "note") {
      if (p.kind === "takeaway" && typeof p.text === "string") out.takeaway = p.text;

    }
  }

}

function mergeUser(cv){
  var seen={};allEvents().forEach(function(e){seen[evKey(e)]=1});

  U.log.sort(function(a,b){return Date.parse(a.ts)-Date.parse(b.ts)});

 ta.oninput=cnt;cnt();if(s.takeaway)root.querySelector('#tMsg').textContent='已保存过，改完可以再存。';

function lsClose(root){var s=lsStat(LS.id),C0=LS.lesson.close||{},ph=C0.phrase||'完成';
 if(s.status==='done'){lsDoneView(root,s);return}
 if(s.status!=='lit'){root.innerHTML='<div class="sc-k an">🏁 完成</div><div class="sc-h an">先完成自测（全对点亮），再回来输入「'+esc(ph)+'」</div><div class="row2 an"><button class="btn pri" id="cQ">去自测</button></div>';root.querySelector('#cQ').onclick=function(){lsGo('quiz')};return}
 root.innerHTML='<div class="sc-k an">🏁 完成</div><div class="sc-h an">'+rich(C0.hint||('输入「'+ph+'」结束本课'))+'</div>'+(s.takeaway?'':'<div class="card an no">还没写感想——可以先去写，也可以直接结束。 <button class="btn" id="cT">去写感想</button></div>')+'<div class="row2 an"><input type="text" id="cIn" placeholder="输入「'+esc(ph)+'」" style="max-width:260px"><button class="btn pri" id="cGo" disabled>结束本课</button></div>';
 var inp=root.querySelector('#cIn'),go=root.querySelector('#cGo'),ct=root.querySelector('#cT');if(ct)ct.onclick=function(){lsGo('takeaway')};

 go.onclick=function(){if(inp.value.trim()!==ph)return;logEv(LS.id,'done',{reply:ph});burst();lsDoneView(root,lsStat(LS.id))}}
function lsDoneView(root,s){var L=LS.lesson,d=new Date(s.doneAt),nI=L.chapters.filter(function(c){return c.interaction}).length;
 root.innerHTML='<div class="doneBig an">✅ '+esc(L.short)+' 已完成</div><div class="lead an">'+esc(d.toLocaleString('zh-CN',{hour12:false}))+'</div><ul class="pts"><li class="an">章节 '+s.chaptersDone.length+' / '+L.chapters.length+'</li><li class="an">互动 '+s.interactionsDone.length+' / '+nI+'</li><li class="an">自测全对 ✓</li><li class="an">感想：'+(s.takeaway?esc(s.takeaway.slice(0,60))+(s.takeaway.length>60?'…':''):'（没写）')+'</li></ul><div class="row2 an"><button class="btn" id="dExp">导出记录</button><button class="btn pri" id="dMap">回到星图</button></div>';

function lsPrep(root){var L=LS.lesson,P0=L.prep||{prepare:[]},due='';
 if(L.due){var dd=new Date(L.due+'T00:00:00');due='<div class="lead an">📅 截止：'+esc(L.due)+'（周'+'日一二三四五六'.charAt(dd.getDay())+'）</div>'}
 root.innerHTML='<div class="sc-k an">课前说明</div><div class="big an">'+esc((LS.icon||'📖')+' '+L.title)+'</div><div class="lead an">'+rich(L.summary)+'</div>'+due+(P0.minutes?'<div class="lead an">⏱ '+rich(P0.minutes)+'</div>':'')+
  '<div class="sc-h an" style="margin-top:3vh">准备</div><ul class="pts">'+P0.prepare.map(function(x){return '<li class="an">'+rich(x)+'</li>'}).join('')+'</ul>'+
  (P0.reading&&P0.reading.length?'<div class="sc-h an">建议阅读</div>'+P0.reading.map(function(r){var u=r.url&&/^https?:\/\//.test(r.url);return '<div class="card an">《'+esc(r.title)+'》'+(r.author?' · '+esc(r.author):'')+(r.part?' · <b>'+esc(r.part)+'</b>':'')+' '+(r.required?'<span class="lab lab-d">必读</span>':'<span class="lab lab-a">可选</span>')+(r.note?'<div class="mut">'+rich(r.note)+'</div>':'')+(u?'<div><a href="'+esc(r.url)+'" target="_blank" rel="noopener" style="color:var(--cyan)">打开 ↗</a></div>':'')+'</div>'}).join(''):'')+
  '<div class="row2 an"><button class="btn pri" id="pGo">开始第一章 ▶</button></div>';
 root.querySelector('#pGo').onclick=function(){lsGo(1);lsPlay()}}
function lsHead(){var s=lsStat(LS.id),b=$('lstate');b.textContent=lsStatusText(LS.id,true);b.className='badge '+(s.status==='done'?'b-mastered':s.status==='lit'?'b-lit':s.status==='progress'?'b-learning':'b-unseen');
 $('lcrumb').innerHTML='学者 · '+esc((T[LS.home_topic]||{}).name||'')+' · <b>'+esc((LS.icon||'📖')+' '+LS.lesson.title)+'</b>'}
function lsRail(){var L=LS.lesson,s=lsStat(LS.id),cur=lsCur,r=$('lrail'),html='',part=null;
 function item(key,mark,text,mn){var on=cur&&(cur.k===key||(cur.c&&cur.c.id===key));return '<div class="ri'+(on?' cur':'')+'" data-k="'+esc(key)+'"><span class="mk">'+mark+'</span><span class="t">'+text+'</span>'+(mn?'<span class="mn">'+mn+'</span>':'')+'</div>'}
 html+=item('prep','','课前说明');
 L.chapters.forEach(function(c){if(c.part!==part){part=c.part;html+='<div class="rp">'+esc(part)+'</div>'}html+=item(c.id,s.chaptersDone.indexOf(c.id)>=0?'✓':'',esc(c.title)+(c.interaction?' 🎯':''),c.minutes+' 分钟')});
 html+='<div class="rp">收尾</div>'+item('quiz',(s.status==='lit'||s.status==='done')?'✓':'','自测（'+(LS.quiz||[]).length+' 题）')+item('takeaway',s.takeaway?'✓':'','写感想')+item('close',s.status==='done'?'✅':'','完成');
 r.innerHTML=html;r.querySelectorAll('.ri').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-k');lsGo(/^c\d+$/.test(k)?k+'.0':k)}});
 var c2=r.querySelector('.ri.cur');if(c2&&c2.scrollIntoView)try{c2.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}}
function lsBar(){var st=lsCur,p=$('lprog').querySelector('.fl'),tm=$('ltime');if(!st)return;
 if(st.c){var sc=st.c.scenes,tot=0,before=0;sc.forEach(function(x,i){var d=sceneSec(x);tot+=d;if(st.t!=='scene'||i<st.si)before+=d});var pos=before+(st.t==='scene'?Math.min(lsElapsed,sceneSec(st.s)):0);
  p.style.width=(pos/tot*100).toFixed(1)+'%';tm.textContent=(st.t==='inter'?'互动 · ':'')+'本章 '+fmt(pos)+' / '+fmt(tot)}
 else{p.style.width=(lsIdx/(lsSteps.length-1)*100).toFixed(1)+'%';tm.textContent={prep:'课前说明',quiz:'自测',takeaway:'写感想',close:'完成'}[st.t]}
 $('lPlay').textContent=lsPlaying?'⏸':'▶';$('lPrev').disabled=lsIdx===0;$('lNext').disabled=lsIdx===lsSteps.length-1}
function lsRender(){var st=lsSteps[lsIdx];lsCur=st;var stage=$('lstage');stage.innerHTML='';stage.scrollTop=0;var root=h('div','lsc',null,stage);
 if(st.t==='prep')lsPrep(root);else if(st.t==='scene'){root.classList.add('c');root.innerHTML=lsScene(st.s)}
 else if(st.t==='inter'){if(st.c.interaction.type==='guess')lsGuess(st.c.interaction,root);else lsSort(st.c.interaction,root)}
 else if(st.t==='quiz')lsQuiz(root);else if(st.t==='takeaway')lsTake(root);else lsClose(root);
 var an=root.querySelectorAll('.an,.anf'),gap=st.t==='scene'?Math.min(.9,sceneSec(st.s)*.5/(an.length+1)):.05;an.forEach(function(e,i){e.style.transitionDelay=(i*gap).toFixed(2)+'s'});
 requestAnimationFrame(function(){requestAnimationFrame(function(){root.classList.add('in');root.querySelectorAll('g.mk').forEach(function(g){g.style.opacity=1})})});
 lsHead();lsRail();lsBar();
 try{history.replaceState(null,'','#/node/'+encodeURIComponent(LS.id)+'&step='+st.k)}catch(e){}}
function lsGo(k,keep){var i=typeof k==='number'?k:lsSteps.findIndex(function(s){return s.k===k});if(i<0)i=0;if(i>lsSteps.length-1)i=lsSteps.length-1;
 var prev=lsCur,nx=lsSteps[i];
 if(prev&&prev.c&&i>lsIdx&&(nx.c!==prev.c||nx.t==='inter'))lsChapterDone(prev.c.id);
 lsPlaying=(keep||lsPlaying)&&nx.t==='scene';lsIdx=i;lsElapsed=0;lsRender()}
function lsPlay(){if(!lsOn||!lsCur)return;if(lsCur.t==='prep'){lsGo(1)}if(lsCur.t!=='scene')return;var was=lsPlaying;lsPlaying=true;lsLast=performance.now();lsBar();if(!was)requestAnimationFrame(lsTick)}
function lsPause(){lsPlaying=false;if(lsCur)lsBar()}
function lsTick(now){if(!lsPlaying||!lsOn)return;var dt=Math.min(.25,(now-lsLast)/1000);lsLast=now;var st=lsCur;if(st.t!=='scene'){lsPause();return}
 lsElapsed+=dt;if(lsElapsed>=sceneSec(st.s)){if(lsIdx<lsSteps.length-1)lsGo(lsIdx+1,true);else lsPause()}else lsBar();
 if(lsPlaying)requestAnimationFrame(lsTick)}
function openLesson(id,step){var n=N[id];if(!n||!n.lesson)return;if(cineOn)closeCine();closeTimeline();panel.classList.remove('on');
 LS=n;lsSteps=lsBuildSteps(n.lesson);lsLoggedCh={};lsIdx=0;lsCur=null;lsPlaying=false;lsOn=true;$('lesson').classList.add('on');document.body.classList.add('cine');
 logEv(id,'open',{view:'lesson'});var i=-1;if(step){i=lsSteps.findIndex(function(s){return s.k===step});if(i<0&&/^c\d+$/.test(step))i=lsSteps.findIndex(function(s){return s.k===step+'.0'})}
 lsGo(i>=0?i:0)}

$('lPrev').onclick=function(){if(lsIdx>0)lsGo(lsIdx-1)};$('lNext').onclick=function(){if(lsIdx<lsSteps.length-1)lsGo(lsIdx+1)};
$('lPlay').onclick=function(){lsPlaying?lsPause():lsPlay()};$('lClose').onclick=closeLesson;

/* ---- boot ---- */
renderMap();
var f0=fitIds(W.domains.map(function(d){return d.id}),1.02);C.x=f0.x;C.y=f0.y;C.k=f0.k*.55;applyCam();
var hp={};(location.search+location.hash).replace(/^[?#]/,'').split(/[&#]/).forEach(function(kv){var a=kv.split('=');if(a[0])hp[a[0]]=decodeURIComponent(a[1]||'')});var m=location.hash.match(/^#\/node\/([^&?/]+)/);if(m)hp.node=decodeURIComponent(m[1]);
if(hp.demo){save=function(){};var dn=Date.now();(hp.demo.split(',')).forEach(function(kv,i){var a=kv.split(':'),st=a[1]||'lit';if(!N[a[0]])return;var ts=new Date(dn-86400000*3+i).toISOString(),ev={ts:ts,device:'demo',node:a[0]};
  if(st==='seen'){ev.action='open'}else if(st==='learning'){ev.action='play';ev.payload={progress:0.6}}else{ev.action='lit';ev.payload={via:'manual'}}
  SESSION.push(ev);
  if(st==='mastered')SESSION.push({ts:new Date(dn-i).toISOString(),device:'demo',node:a[0],action:'review',payload:{passed:true}})});
  recomputeMS();refreshAll();updateCount()}
lessonPill();
var lsId=(hp.lesson&&N[hp.lesson]&&N[hp.lesson].lesson)?hp.lesson:(hp.node&&N[hp.node]&&N[hp.node].lesson)?hp.node:null;
if(lsId){C.k=f0.k;applyCam();openLesson(lsId,hp.step)}
else if(hp.node&&N[hp.node]&&N[hp.node].quiz){C.k=f0.k;applyCam();openCine(hp.node,parseFloat(hp.t||0),hp.t!=null)}
else if(hp.view==='timeline'){C.k=f0.k;applyCam();openTimeline()}

else home(1800);
})();
