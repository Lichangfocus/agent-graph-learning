nodes:
  - id: n-thermo
    topic: t-phys
    kind: concept
    name: 热力学与能量转换
    summary: 能量守恒、熵与热机效率：为什么蒸汽机能把热变成功、又有上限。
  - id: n-nitrogen
    topic: t-chem
    kind: concept
    name: 固氮与合成氨
    summary: 哈伯–博施法把空气中的氮变成化肥，支撑了 20 世纪的人口增长。
  - id: n-cosmos
    topic: t-astro
    kind: concept
    name: 宇宙与日心说
    summary: 从地心到日心：观测数据与数学模型如何改写宇宙图景。
  - id: n-climate
    topic: t-earth
    kind: concept
    name: 地理与气候
    summary: 全新世稳定气候、大陆轴向与地形如何约束文明。
  - id: n-domestic
    topic: t-bio
    kind: concept
    name: 驯化与遗传
    summary: 人工选择如何把野生动植物改造成作物与家畜。
  - id: n-human-evo
    topic: t-evo
    kind: concept
    name: 人类演化
    summary: 人属、智人、走出非洲与古人类混血。
  - id: n-epidemic
    topic: t-med
    kind: concept
    name: 传染病与人口
    summary: 人畜共患病、瘟疫沿交换网络传播，深刻改变人口与历史。
  - id: n-axiom
    topic: t-geom
    kind: concept
    name: 公理化方法
    summary: 从少数公理推出全部定理——《几何原本》的范式。
  - id: n-computability
    topic: t-logic
    kind: concept
    name: 可计算性
    summary: 图灵机：什么问题原则上能被机械地算出来。
  - id: n-prob
    topic: t-stat
    kind: concept
    name: 概率思维
    summary: 用分布而不是单一答案描述不确定性。
  - id: n-fossil
    topic: t-energy
    kind: concept
    name: 化石能源
    summary: 煤、石油、天然气：开采亿万年储存的太阳能。
  - id: n-grid
    topic: t-energy
    kind: concept
    name: 电力与电网
    summary: 发电、输电与电气化。
  - id: n-computer
    topic: t-cs
    kind: concept
    name: 计算机与互联网
    summary: 晶体管 → 集成电路 → 互联网：信息成为生产资料。
  - id: n-print
    topic: t-media
    kind: concept
    name: 印刷与信息媒介
    summary: 纸、雕版、活字、古登堡：复制成本下降如何改变知识传播。
  - id: n-metal
    topic: t-mat
    kind: concept
    name: 冶金：青铜到钢铁
    summary: 冶炼技术如何决定工具、武器与农业规模。
  - id: n-money
    topic: t-econ
    kind: concept
    name: 市场与货币
    summary: 铸币、纸币与市场：交换如何扩展合作。
  - id: n-growth
    topic: t-econ
    kind: concept
    name: 经济增长
    summary: 为什么人均收入长期停滞，又在近代开始持续增长。
  - id: n-state
    topic: t-pol
    kind: concept
    name: 国家的起源
    summary: 强制、再分配与合法性：国家是什么。
  - id: n-nation
    topic: t-pol
    kind: concept
    name: 民族国家理论
    summary: 主权、人民与边界；「想象的共同体」。
  - id: n-bureau
    topic: t-sociology
    kind: concept
    name: 官僚与科层
    summary: 怎样用规则和职位组织大量陌生人。
  - id: n-cogn
    topic: t-psy
    kind: concept
    name: 认知与语言能力
    summary: 人类认知的独特性：共享意图、符号与累积文化。
  - id: n-keju
    topic: t-china
    kind: concept
    name: 科举与士大夫
    summary: 隋唐起逐步成形的选官制度，1905 年废除。
  - id: n-needham
    topic: t-scihist
    kind: concept
    name: 李约瑟问题
    summary: 为何近代科学没有在中国产生？以及这个问题本身的预设。
  - id: n-axial-schools
    topic: t-axialphil
    kind: concept
    name: 轴心哲学流派
    summary: 儒、道、墨、法；希腊哲学；印度诸派。
  - id: n-world-religions
    topic: t-religion
    kind: concept
    name: 世界宗教起源
    summary: 佛教、基督教、伊斯兰教如何从思想变成跨地域秩序。
  - id: n-sci-method
    topic: t-epist
    kind: concept
    name: 科学方法
    summary: 实验、数学化、公开发表与同行纠错。
  - id: n-rights
    topic: t-ethics
    kind: concept
    name: 权利与社会契约
    summary: 用理性重新论证政治正当性。
  - id: n-cave-art
    topic: t-visual
    kind: concept
    name: 史前艺术
    summary: 装饰品、颜料与洞穴岩画：符号能力的证据。
  - id: n-epic
    topic: t-lit
    kind: concept
    name: 史诗与叙事
    summary: 《吉尔伽美什》等：文字让叙事被固定下来。
  - id: n-early-music
    topic: t-music
    kind: concept
    name: 早期乐器
    summary: 贾湖骨笛等：音乐的久远起源。
  - id: n-lang-origin
    topic: t-linguistics
    kind: concept
    name: 语言起源
    summary: 语言何时、如何出现——至今无定论。
  - id: n-writing
    topic: t-writing
    kind: concept
    name: 文字系统
    summary: 楔形文字、圣书字、甲骨文与字母：记录信息的技术。
  - id: n-deeplearning
    topic: t-ml
    kind: concept
    name: 深度学习
    summary: 从 2012 年 AlexNet 起，用多层神经网络从数据中学表示。
  - id: n-transformer
    topic: t-ml
    kind: concept
    name: Transformer
    summary: 2017 年《Attention Is All You Need》：大模型的基础架构。
  - id: n-agents
    topic: t-agents
    kind: concept
    name: 智能体与人机协作
    summary: 模型调用工具、拆解任务，与人分工。
  - id: n-aigov
    topic: t-aigov
    kind: concept
    name: AI 治理
    summary: 欧盟《人工智能法》、中国生成式 AI 办法等规则体系。
